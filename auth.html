<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha RPG — Entrar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logo { font-size: 36px; margin-bottom: 8px; }
        .logo-titulo { font-size: 20px; font-weight: bold; color: #c8aa6e; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
        .logo-sub { font-size: 12px; color: #555; margin-bottom: 32px; }

        .auth-box {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-top: 3px solid #c8aa6e;
            border-radius: 8px;
            padding: 28px 28px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.8);
        }

        .tabs { display: flex; border-bottom: 1px solid #2a2a2a; margin-bottom: 24px; }
        .tab-btn {
            flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
            color: #555; font-size: 14px; font-weight: bold; padding: 10px 0; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px; font-family: inherit;
            transition: color 0.2s, border-color 0.2s; margin-bottom: -1px;
        }
        .tab-btn.ativo { color: #c8aa6e; border-bottom-color: #c8aa6e; }

        .auth-form { display: none; flex-direction: column; gap: 14px; }
        .auth-form.visivel { display: flex; }

        .campo label { display: block; font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; width: auto; }
        .campo input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 10px 12px; border-radius: 4px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .campo input:focus { border-color: #c8aa6e; }

        .campo-senha { position: relative; }
        .campo-senha input { padding-right: 52px; }
        .toggle-senha { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #555; font-size: 12px; cursor: pointer; font-family: inherit; padding: 2px 4px; transition: color 0.2s; }
        .toggle-senha:hover { color: #c8aa6e; }

        .forca-wrap { margin-top: 6px; }
        .forca-bar { height: 3px; border-radius: 2px; width: 0; transition: width 0.3s, background 0.3s; background: #444; }
        .forca-label { font-size: 11px; color: #555; margin-top: 4px; min-height: 14px; }

        .msg { font-size: 13px; min-height: 18px; text-align: center; font-weight: bold; }
        .msg.erro    { color: #e74c3c; }
        .msg.sucesso { color: #4CAF50; }

        .btn-principal {
            background: #c8aa6e; color: #0f0f0f; border: none; padding: 12px; border-radius: 5px;
            font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase;
            letter-spacing: 0.5px; font-family: inherit; transition: background 0.2s, opacity 0.2s;
        }
        .btn-principal:hover { background: #d4ba80; }
        .btn-principal:active { opacity: 0.85; }
        .btn-principal:disabled { opacity: 0.6; cursor: not-allowed; }

        .link-alternar { text-align: center; font-size: 13px; color: #555; margin-top: 4px; }
        .link-alternar span { color: #c8aa6e; cursor: pointer; font-weight: bold; }
        .link-alternar span:hover { text-decoration: underline; }
    </style>
</head>
<body>

<!-- Supabase CDN — OBRIGATÓRIO antes de auth.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="logo">⚔️</div>
<div class="logo-titulo">Ficha RPG</div>
<div class="logo-sub">Faça login para acessar suas fichas</div>

<div class="auth-box">
    <div class="tabs">
        <button class="tab-btn ativo" id="tab-login" onclick="mostrarAba('login')">Entrar</button>
        <button class="tab-btn" id="tab-cadastro" onclick="mostrarAba('cadastro')">Cadastrar</button>
    </div>

    <!-- FORM LOGIN -->
    <form class="auth-form visivel" id="form-login" onsubmit="fazerLogin(event)">
        <div class="campo">
            <label>E-mail</label>
            <input type="email" id="l-email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="campo">
            <label>Senha</label>
            <div class="campo-senha">
                <input type="password" id="l-senha" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="toggle-senha" onclick="toggleVer('l-senha', this)">ver</button>
            </div>
        </div>
        <div class="msg" id="msg-login"></div>
        <button type="submit" class="btn-principal" id="btn-login">Entrar na conta</button>
        <p class="link-alternar">Não tem conta? <span onclick="mostrarAba('cadastro')">Cadastre-se</span></p>
    </form>

    <!-- FORM CADASTRO -->
    <form class="auth-form" id="form-cadastro" onsubmit="fazerCadastro(event)">
        <div class="campo">
            <label>Nome completo</label>
            <input type="text" id="c-nome" placeholder="Seu nome" autocomplete="name" required>
        </div>
        <div class="campo">
            <label>E-mail</label>
            <input type="email" id="c-email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="campo">
            <label>Senha</label>
            <div class="campo-senha">
                <input type="password" id="c-senha" placeholder="mínimo 6 caracteres" autocomplete="new-password" oninput="checkForca()" required>
                <button type="button" class="toggle-senha" onclick="toggleVer('c-senha', this)">ver</button>
            </div>
            <div class="forca-wrap">
                <div class="forca-bar" id="forca-bar"></div>
                <div class="forca-label" id="forca-label"></div>
            </div>
        </div>
        <div class="campo">
            <label>Confirmar senha</label>
            <div class="campo-senha">
                <input type="password" id="c-confirma" placeholder="repita a senha" autocomplete="new-password" required>
                <button type="button" class="toggle-senha" onclick="toggleVer('c-confirma', this)">ver</button>
            </div>
        </div>
        <div class="msg" id="msg-cadastro"></div>
        <button type="submit" class="btn-principal" id="btn-cadastro">Criar conta</button>
        <p class="link-alternar">Já tem conta? <span onclick="mostrarAba('login')">Entrar</span></p>
    </form>
</div>

<script src="auth.js"></script>
<script>
    // Verifica sessão ativa ao carregar
    (async () => {
        const logado = await sincronizarSessao();
        if (logado) window.location.replace(PAINEL_PAGE);
    })();

    function mostrarAba(aba) {
        const isLogin = aba === 'login';
        document.getElementById('form-login').classList.toggle('visivel', isLogin);
        document.getElementById('form-cadastro').classList.toggle('visivel', !isLogin);
        document.getElementById('tab-login').classList.toggle('ativo', isLogin);
        document.getElementById('tab-cadastro').classList.toggle('ativo', !isLogin);
    }

    function toggleVer(inputId, btn) {
        const el = document.getElementById(inputId);
        const escondido = el.type === 'password';
        el.type = escondido ? 'text' : 'password';
        btn.textContent = escondido ? 'ocultar' : 'ver';
    }

    function setMsg(id, texto, tipo) {
        const el = document.getElementById(id);
        el.textContent = texto;
        el.className = 'msg ' + tipo;
    }

    function checkForca() {
        const senha = document.getElementById('c-senha').value;
        const bar   = document.getElementById('forca-bar');
        const label = document.getElementById('forca-label');
        let pts = 0;
        if (senha.length >= 6)  pts++;
        if (senha.length >= 10) pts++;
        if (/[A-Z]/.test(senha)) pts++;
        if (/[0-9]/.test(senha)) pts++;
        if (/[^A-Za-z0-9]/.test(senha)) pts++;
        const niveis = [
            { w: '0%',   cor: '#444',    txt: '' },
            { w: '25%',  cor: '#e74c3c', txt: 'Fraca' },
            { w: '50%',  cor: '#e67e22', txt: 'Razoável' },
            { w: '75%',  cor: '#f1c40f', txt: 'Boa' },
            { w: '100%', cor: '#4CAF50', txt: 'Forte' },
        ];
        const n = niveis[Math.min(pts, 4)];
        bar.style.width      = n.w;
        bar.style.background = n.cor;
        label.textContent    = n.txt ? 'Força: ' + n.txt : '';
        label.style.color    = n.cor;
    }

    async function fazerLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.textContent = 'Entrando...';
        setMsg('msg-login', '', '');

        const email = document.getElementById('l-email').value.trim();
        const senha = document.getElementById('l-senha').value;
        const res   = await loginUsuario(email, senha);

        if (!res.ok) {
            setMsg('msg-login', res.erro, 'erro');
            btn.disabled = false;
            btn.textContent = 'Entrar na conta';
            return;
        }
        window.location.replace(PAINEL_PAGE);
    }

    async function fazerCadastro(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-cadastro');
        btn.disabled = true;
        btn.textContent = 'Criando conta...';
        setMsg('msg-cadastro', '', '');

        const nome     = document.getElementById('c-nome').value.trim();
        const email    = document.getElementById('c-email').value.trim();
        const senha    = document.getElementById('c-senha').value;
        const confirma = document.getElementById('c-confirma').value;

        if (senha !== confirma) {
            setMsg('msg-cadastro', 'As senhas não coincidem.', 'erro');
            btn.disabled = false;
            btn.textContent = 'Criar conta';
            return;
        }

        const res = await cadastrar(nome, email, senha);
        if (!res.ok) {
            setMsg('msg-cadastro', res.erro, 'erro');
            btn.disabled = false;
            btn.textContent = 'Criar conta';
            return;
        }
        setMsg('msg-cadastro', 'Conta criada! Redirecionando...', 'sucesso');
        setTimeout(() => window.location.replace(PAINEL_PAGE), 900);
    }
</script>

</body>
</html>
