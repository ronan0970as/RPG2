<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Ficha RPG - Talentos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ══ Status pills ══════════════════════════════════════ */
        .status-panel { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .status-pill { flex: 1; min-width: 150px; background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s; }
        .status-pill:hover { border-color: #c8aa6e; }
        .status-pill .s-label { font-size: 12px; font-weight: bold; color: #888; text-transform: uppercase; white-space: nowrap; }
        .status-pill .bar-wrap { flex: 1; height: 8px; background: #0f0f0f; border-radius: 4px; overflow: hidden; }
        .status-pill .bar { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
        .bar-hp  { background: linear-gradient(90deg, #c0392b, #e74c3c); }
        .bar-mp  { background: linear-gradient(90deg, #1a5276, #2980b9); }
        .bar-san { background: linear-gradient(90deg, #4a235a, #8e44ad); }
        .status-pill .s-val { font-size: 12px; font-weight: bold; white-space: nowrap; }
        .val-hp { color: #ff8c00; } .val-mp { color: #00bfff; } .val-san { color: #b0c4de; }

        /* ══ Grid de atributos ════════════════════════════════ */
        .attr-resumo { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 20px; }
        .attr-chip { background: #111; border: 1px solid #2a2a2a; border-radius: 5px; padding: 7px 10px; text-align: center; transition: border-color 0.2s; }
        .attr-chip:hover { border-color: #c8aa6e; }
        .attr-chip .a-nome { font-size: 10px; color: #888; text-transform: uppercase; }
        .attr-chip .a-val  { font-size: 20px; font-weight: bold; color: #4CAF50; margin: 2px 0; }
        .attr-chip .a-base { font-size: 10px; color: #555; }
        .attr-chip .a-buff { font-size: 11px; font-weight: bold; min-height: 15px; }

        /* ══ Lista de talentos ════════════════════════════════ */
        #lista-talentos { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
        .talento-card { background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 14px; transition: border-color 0.3s, opacity 0.3s; }
        .talento-card.ativo  { border-color: #4CAF50; }
        .talento-card.inativo { opacity: 0.5; border-color: #2a2a2a; }

        /* ── Cor da borda por categoria ── */
        .talento-card.cat-habilidade { border-left: 3px solid #5dade2; }
        .talento-card.cat-raca       { border-left: 3px solid #a569bd; }
        .talento-card.cat-talento    { border-left: 3px solid #4CAF50; }

        .talento-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .toggle-ativo { width: 40px; height: 24px; background: #0f0f0f; border-radius: 12px; position: relative; cursor: pointer; border: 1px solid #333; flex-shrink: 0; transition: background 0.25s; }
        .toggle-ativo::after { content: ''; position: absolute; width: 18px; height: 18px; background: #444; border-radius: 50%; top: 2px; left: 2px; transition: left 0.25s, background 0.25s; }
        .toggle-ativo.on { background: rgba(76,175,80,0.2); border-color: #4CAF50; }
        .toggle-ativo.on::after { left: 18px; background: #4CAF50; }

        .talento-nome { flex: 1; min-width: 120px; background: #0f0f0f; border: 1px solid #333; color: #c8aa6e; padding: 8px 10px; border-radius: 4px; font-weight: bold; font-size: 15px; outline: none; font-family: inherit; transition: border-color 0.2s; -webkit-appearance: none; }
        .talento-nome:focus { border-color: #c8aa6e; }

        /* ── Selects de tipo e categoria ── */
        .tipo-badge,
        .cat-badge {
            background: #0f0f0f; border: 1px solid #333; color: #888; padding: 8px; border-radius: 4px;
            font-size: 13px; cursor: pointer; outline: none; font-family: inherit;
            transition: border-color 0.2s; -webkit-appearance: none; min-height: 40px;
        }
        .tipo-badge:focus, .cat-badge:focus { border-color: #c8aa6e; color: #c8aa6e; }
        .tipo-badge option, .cat-badge option { background: #1a1a1a; }

        /* Cor do select de categoria conforme valor */
        .cat-badge.cat-talento    { border-color: #3a5a3a; color: #4CAF50; }
        .cat-badge.cat-habilidade { border-color: #1a4060; color: #5dade2; }
        .cat-badge.cat-raca       { border-color: #4a2a60; color: #a569bd; }

        /* ── Linha de raça no card ── */
        .raca-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .raca-row label {
            font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase;
            letter-spacing: 0.4px; white-space: nowrap; width: auto; min-width: 0;
        }
        .raca-input {
            flex: 1; min-width: 140px; background: #0f0f0f; border: 1px solid #333; color: #a569bd;
            padding: 7px 10px; border-radius: 4px; font-size: 14px; font-family: inherit;
            outline: none; transition: border-color 0.2s; -webkit-appearance: none;
        }
        .raca-input:focus { border-color: #a569bd; }
        .raca-input::placeholder { color: #555; }

        /* Badge de raça exibido no header do card (read-only visual) */
        .raca-badge-display {
            display: inline-flex; align-items: center; gap: 4px; background: rgba(165,105,189,0.1);
            border: 1px solid rgba(165,105,189,0.3); border-radius: 12px;
            padding: 3px 9px; font-size: 11px; font-weight: bold; color: #a569bd;
            white-space: nowrap; flex-shrink: 0;
        }
        .raca-badge-display:empty { display: none; }

        .btn-remover { background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; min-height: 40px; min-width: 40px; }
        .btn-remover:hover { background: rgba(255,77,77,0.1); }

        /* ══ Corpo do talento ══════════════════════════════════ */
        .talento-body { display: flex; gap: 12px; align-items: flex-start; }
        .talento-desc { flex: 1; min-width: 0; background: #0f0f0f; border: 1px solid #333; color: #ccc; padding: 8px; border-radius: 4px; font-size: 15px; resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.5; outline: none; transition: border-color 0.2s; -webkit-appearance: none; width: 100%; }
        .talento-desc:focus { border-color: #c8aa6e; }

        /* ══ Painel de buffs ════════════════════════════════════ */
        .buff-panel { min-width: 220px; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 5px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
        .buff-panel-title { font-size: 11px; color: #c8aa6e; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; border-bottom: 1px solid #2a2a2a; padding-bottom: 4px; }
        .buff-row { display: flex; align-items: center; gap: 5px; }
        .buff-row .b-label { font-size: 11px; font-weight: bold; color: #888; width: 85px; flex-shrink: 0; }
        .buff-row .buff-input { flex: 1; min-width: 0; background: #111; border: 1px solid #333; color: #c8aa6e; padding: 5px 6px; border-radius: 4px; font-size: 14px; font-weight: bold; text-align: center; outline: none; font-family: inherit; transition: border-color 0.2s; -webkit-appearance: none; }
        .buff-row .buff-input:focus { border-color: #c8aa6e; }

        .calc-secao { margin-top: 6px; border-top: 1px solid #2a2a2a; padding-top: 6px; }
        .calc-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; flex-wrap: wrap; }
        .calc-row .c-label { font-size: 11px; font-weight: bold; width: 55px; flex-shrink: 0; }
        .calc-row input[type="text"] { flex: 1; min-width: 50px; background: #111; border: 1px solid #333; color: #fff; padding: 5px 6px; border-radius: 4px; font-size: 14px; outline: none; font-family: inherit; transition: border-color 0.2s; -webkit-appearance: none; }
        .calc-row input[type="text"]:focus { border-color: #c8aa6e; }
        .btn-aplicar { background: #2a2a2a; color: #888; border: 1px solid #333; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; min-height: 36px; }
        .btn-aplicar:hover { background: rgba(200,170,110,0.1); border-color: #c8aa6e; color: #c8aa6e; }
        .feedback-calc { font-size: 11px; min-height: 13px; font-weight: bold; }

        .btns-principais { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
        .btn-add { flex: 1; background: transparent; border: 2px dashed #4CAF50; color: #4CAF50; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; transition: background 0.2s; min-height: 48px; }
        .btn-add:hover { background: rgba(76,175,80,0.08); }
        .btn-salvar { flex: 1; background: #4CAF50; color: white; border: none; padding: 14px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 15px; transition: background 0.2s; min-height: 48px; }
        .btn-salvar:hover { background: #45a049; }

        #toast { position: fixed; bottom: 24px; right: 16px; background: #1a1a1a; border: 1px solid #c8aa6e; color: #c8aa6e; padding: 12px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; opacity: 0; transform: translateY(10px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 999; }
        #toast.show { opacity: 1; transform: translateY(0); }

        /* ══ Barra de Pesquisa ══════════════════════════════════ */
        .pesquisa-bar {
            display: flex; flex-direction: column; gap: 10px;
            background: #111; border: 1px solid #2a2a2a; border-radius: 6px;
            padding: 14px; margin-bottom: 16px;
        }
        .pesquisa-linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .pesquisa-label { font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }

        #inputPesquisaTalento {
            flex: 1; min-width: 160px; background: #0f0f0f; border: 1px solid #333;
            color: #fff; padding: 9px 12px; border-radius: 4px; font-size: 16px;
            outline: none; font-family: inherit; transition: border-color 0.2s; -webkit-appearance: none;
        }
        #inputPesquisaTalento:focus { border-color: #c8aa6e; }

        /* Input de raça na pesquisa */
        #inputFiltroRaca {
            flex: 1; min-width: 140px; max-width: 260px;
            background: #0f0f0f; border: 1px solid #333; color: #a569bd;
            padding: 9px 12px; border-radius: 4px; font-size: 16px;
            outline: none; font-family: inherit; transition: border-color 0.2s; -webkit-appearance: none;
        }
        #inputFiltroRaca:focus { border-color: #a569bd; }
        #inputFiltroRaca::placeholder { color: #555; }

        /* Sugestões de raça (datalist visual personalizado) */
        .raca-sugestoes {
            display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px;
        }
        .raca-tag {
            background: rgba(165,105,189,0.1); border: 1px solid rgba(165,105,189,0.25);
            color: #a569bd; border-radius: 12px; padding: 4px 10px;
            font-size: 11px; font-weight: bold; cursor: pointer;
            transition: background 0.2s, border-color 0.2s; white-space: nowrap;
        }
        .raca-tag:hover { background: rgba(165,105,189,0.2); border-color: #a569bd; }
        .raca-tag.active { background: rgba(165,105,189,0.25); border-color: #a569bd; color: #c084e0; }

        .filtro-tipo-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-tipo-filtro {
            background: transparent; border: 1px solid #333; color: #666;
            padding: 7px 11px; border-radius: 4px; cursor: pointer; font-size: 12px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 0.4px;
            transition: 0.2s; font-family: inherit; min-height: 40px;
        }
        .btn-tipo-filtro:hover { border-color: #c8aa6e; color: #c8aa6e; }
        .btn-tipo-filtro.active { border-color: #c8aa6e; color: #c8aa6e; background: rgba(200,170,110,0.1); }

        /* Filtros de categoria */
        .filtro-cat-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-cat-filtro {
            background: transparent; border: 1px solid #2a2a2a; color: #666;
            padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 0.4px;
            transition: 0.2s; font-family: inherit; min-height: 40px;
        }
        .btn-cat-filtro:hover { border-color: #c8aa6e; color: #ccc; }
        .btn-cat-filtro.active { background: rgba(200,170,110,0.08); }
        .btn-cat-filtro[data-cat="todos"].active     { border-color: #c8aa6e; color: #c8aa6e; }
        .btn-cat-filtro[data-cat="Talento"].active   { border-color: #4CAF50; color: #4CAF50; background: rgba(76,175,80,0.08); }
        .btn-cat-filtro[data-cat="Habilidade"].active{ border-color: #5dade2; color: #5dade2; background: rgba(93,173,226,0.08); }
        .btn-cat-filtro[data-cat="Raça"].active      { border-color: #a569bd; color: #a569bd; background: rgba(165,105,189,0.08); }

        .filtro-buff-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-buff-filtro { display: flex; align-items: center; gap: 5px; background: transparent; border: 1px solid #2a2a2a; color: #666; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; font-family: inherit; min-height: 38px; }
        .btn-buff-filtro:hover { border-color: #c8aa6e; color: #ccc; }
        .btn-buff-filtro.active { border-color: #4CAF50; color: #4CAF50; background: rgba(76,175,80,0.08); }
        .btn-buff-filtro .check { width: 14px; height: 14px; border: 1px solid currentColor; border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }

        /* ══ Filtro de Classe ══════════════════════════════════ */
        #inputFiltroClasse {
            flex: 1; min-width: 140px; max-width: 260px;
            background: #0f0f0f; border: 1px solid #333; color: #e8a830;
            padding: 9px 12px; border-radius: 4px; font-size: 16px;
            outline: none; font-family: inherit; transition: border-color 0.2s; -webkit-appearance: none;
        }
        #inputFiltroClasse:focus { border-color: #e8a830; }
        #inputFiltroClasse::placeholder { color: #555; }

        /* Tags de classe dinâmicas */
        .classe-tag {
            background: rgba(232,168,48,0.1); border: 1px solid rgba(232,168,48,0.25);
            color: #e8a830; border-radius: 12px; padding: 4px 10px;
            font-size: 11px; font-weight: bold; cursor: pointer;
            transition: background 0.2s, border-color 0.2s; white-space: nowrap;
        }
        .classe-tag:hover { background: rgba(232,168,48,0.2); border-color: #e8a830; }
        .classe-tag.active { background: rgba(232,168,48,0.25); border-color: #e8a830; color: #ffd060; }

        /* Badge de classe no card de talento */
        .classe-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .classe-row label {
            font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase;
            letter-spacing: 0.4px; white-space: nowrap; width: auto; min-width: 0;
        }
        .classe-input {
            flex: 1; min-width: 140px; background: #0f0f0f; border: 1px solid #333; color: #e8a830;
            padding: 7px 10px; border-radius: 4px; font-size: 14px; font-family: inherit;
            outline: none; transition: border-color 0.2s; -webkit-appearance: none;
        }
        .classe-input:focus { border-color: #e8a830; }
        .classe-input::placeholder { color: #555; }

        .classe-badge-display {
            display: inline-flex; align-items: center; gap: 4px; background: rgba(232,168,48,0.1);
            border: 1px solid rgba(232,168,48,0.3); border-radius: 12px;
            padding: 3px 9px; font-size: 11px; font-weight: bold; color: #e8a830;
            white-space: nowrap; flex-shrink: 0;
        }
        .classe-badge-display:empty { display: none; }

        .resultado-pesquisa { font-size: 11px; color: #555; text-align: right; white-space: nowrap; }
        .talento-card.oculto { display: none; }

        /* ══ Botão IA e painel de buffs dinâmicos ══════════════ */
        .btn-ia {
            background: linear-gradient(135deg, rgba(138,43,226,0.2), rgba(0,191,255,0.15));
            border: 1px solid rgba(138,43,226,0.5);
            color: #b06aff;
            padding: 6px 11px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            transition: 0.2s;
            min-height: 36px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-ia:hover { border-color: #b06aff; background: rgba(138,43,226,0.3); color: #d09fff; }
        .btn-ia:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ia.carregando { animation: ia-pulse 1s infinite; }
        @keyframes ia-pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

        .ia-resultado {
            margin-top: 8px;
            background: rgba(138,43,226,0.08);
            border: 1px solid rgba(138,43,226,0.3);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            display: none;
        }
        .ia-resultado.visivel { display: block; }
        .ia-resultado .ia-titulo { color: #b06aff; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .ia-resultado .ia-buff-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
        .ia-resultado .ia-buff-nome { color: #888; font-size: 11px; width: 90px; flex-shrink: 0; }
        .ia-resultado .ia-buff-val { color: #4CAF50; font-weight: bold; font-size: 13px; }
        .ia-resultado .ia-buff-tipo { color: #555; font-size: 10px; font-style: italic; }
        .ia-resultado .ia-dinamico { background: rgba(0,191,255,0.08); border: 1px solid rgba(0,191,255,0.2); border-radius: 4px; padding: 4px 8px; margin-top: 4px; color: #00bfff; font-size: 11px; }
        .ia-resultado .ia-erro { color: #e74c3c; font-size: 12px; }
        .ia-resultado .ia-aplicar { background: #4CAF50; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; font-family: inherit; margin-top: 6px; transition: 0.2s; }
        .ia-resultado .ia-aplicar:hover { background: #45a049; }

        /* Badge de buff dinâmico no painel de buffs */
        .buff-dinamico-badge {
            margin-top: 6px;
            background: rgba(0,191,255,0.07);
            border: 1px solid rgba(0,191,255,0.2);
            border-radius: 4px;
            padding: 5px 8px;
            font-size: 11px;
            color: #00bfff;
            line-height: 1.4;
            display: none;
        }
        .buff-dinamico-badge.visivel { display: block; }

        /* ══ MOBILE ════════════════════════════════════════════ */
        @media (max-width: 650px) {
            .status-panel { flex-direction: column; gap: 8px; }
            .talento-body { flex-direction: column; }
            .buff-panel { min-width: 0; width: 100%; }
            .attr-resumo { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
            .attr-chip .a-val { font-size: 18px; }
            .btns-principais { flex-direction: column; }
            .btn-add, .btn-salvar { width: 100%; }
            #inputFiltroRaca { max-width: 100%; }
            .pesquisa-linha { gap: 8px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="painel_de_escolhas_de_fichas.html">◀ Fichas</a>
    <a href="index.html">Status</a>
    <a href="talentos.html" class="active">Talentos</a>
    <a href="itens.html">Inventário</a>
</nav>

<div class="rpg-window">
    <h2>⚔️ Status Atual</h2>
    <div class="status-panel">
        <div class="status-pill">
            <span class="s-label">❤️ VIDA</span>
            <div class="bar-wrap"><div class="bar bar-hp" id="barra-hp"></div></div>
            <span class="s-val val-hp" id="display-hp">— / —</span>
        </div>
        <div class="status-pill">
            <span class="s-label">💧 MANA</span>
            <div class="bar-wrap"><div class="bar bar-mp" id="barra-mp"></div></div>
            <span class="s-val val-mp" id="display-mp">— / —</span>
        </div>
        <div class="status-pill">
            <span class="s-label">🧠 SANIDADE</span>
            <div class="bar-wrap"><div class="bar bar-san" id="barra-san"></div></div>
            <span class="s-val val-san" id="display-san">— / —</span>
        </div>
    </div>

    <h2>🗡️ Atributos + Buffs dos Talentos</h2>
    <div class="attr-resumo" id="attr-resumo"></div>

    <h2>✨ Talentos do Personagem</h2>

    <!-- ══ BARRA DE PESQUISA ══ -->
    <div class="pesquisa-bar">

        <!-- Linha 1: texto livre -->
        <div class="pesquisa-linha">
            <span class="pesquisa-label">🔍 Buscar</span>
            <input type="text" id="inputPesquisaTalento" placeholder="Nome ou descrição..." oninput="filtrarTalentos()">
            <span class="resultado-pesquisa" id="resultado-pesquisa"></span>
        </div>

        <!-- Linha 2: Categoria (Todos / Talento / Habilidade / Raça) -->
        <div class="pesquisa-linha">

            <div class="filtro-cat-wrap">
                <button class="btn-cat-filtro active" data-cat="todos"      onclick="selecionarCatFiltro(this)">Todos</button>
                <button class="btn-cat-filtro"        data-cat="Talento"    onclick="selecionarCatFiltro(this)">🌟 Talento</button>

                <button class="btn-tipo-filtro active" data-tipo="todos"    onclick="selecionarTipo(this)">Todos</button>
                <button class="btn-tipo-filtro"        data-tipo="Passivo"  onclick="selecionarTipo(this)">Passivo</button>
                <button class="btn-tipo-filtro"        data-tipo="Ativo"    onclick="selecionarTipo(this)">Ativo</button>
                <button class="btn-tipo-filtro"        data-tipo="Reação"   onclick="selecionarTipo(this)">Reação</button>

            <span class="pesquisa-label">🗡️ Classe</span>
            <input type="text" id="inputFiltroClasse" placeholder="Filtrar por classe..." oninput="filtrarTalentos(); atualizarTagsClasse()">
            <button class="btn-tipo-filtro" onclick="limparFiltroClasse()" title="Limpar filtro de classe" style="padding:7px 9px;font-size:16px;line-height:1;">✕</button>
        </div>
        <!-- Tags de classes existentes nos cards -->
        <div class="pesquisa-linha" id="linha-tags-classe" style="padding-top:0;gap:6px;">
            <span class="pesquisa-label" style="opacity:0;pointer-events:none;user-select:none;">⠀</span>
            <div class="raca-sugestoes" id="classe-sugestoes-filtro"></div>
        </div>

        <!-- Linha 5: Filtro de raça (texto + tags rápidas geradas dinamicamente) -->
        <div class="pesquisa-linha" id="linha-filtro-raca">
            <span class="pesquisa-label">🧬 Raça</span>
            <input type="text" id="inputFiltroRaca" placeholder="Filtrar por raça..." oninput="filtrarTalentos(); atualizarTagsRaca()">
            <button class="btn-tipo-filtro" onclick="limparFiltroRaca()" title="Limpar filtro de raça" style="padding:7px 9px;font-size:16px;line-height:1;">✕</button>
        </div>
        <!-- Tags de raças existentes nos cards -->
        <div class="pesquisa-linha" id="linha-tags-raca" style="padding-top:0;gap:6px;">
            <span class="pesquisa-label" style="opacity:0;pointer-events:none;user-select:none;">⠀</span>
            <div class="raca-sugestoes" id="raca-sugestoes-filtro"></div>
        </div>

        <!-- Linha 6: Buff em atributo -->
        <div class="pesquisa-linha">
            <span class="pesquisa-label">Buff em</span>

    </div><!-- /.pesquisa-bar -->

    <div id="lista-talentos"></div>

    <div class="btns-principais">
        <button class="btn-add" onclick="adicionarTalento()">＋ Adicionar Talento</button>
        <button class="btn-salvar" onclick="salvar()">💾 Salvar Talentos</button>
    </div>
</div>

<div id="toast"></div>

<!-- Supabase CDN — OBRIGATÓRIO antes de auth.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>exigirLogin().then(() => { document.addEventListener('DOMContentLoaded', injetarUsuarioNav); });</script>

<script>
// ── Helpers de ficha ──────────────────────────────────────
function getFichaId() { return localStorage.getItem('rpg_ficha_ativa') || null; }
function k(c) { return getFichaId() + '_' + c; }

// ── Salvar/carregar talentos via Supabase ─────────────────
async function salvarNuvemTalentos(talentos) {
    const fichaId = getFichaId();
    if (!fichaId || !window._supaClient) return;
    localStorage.setItem(k('rpg_talentos'), JSON.stringify(talentos));
    await window._supaClient.from('fichas_dados')
        .upsert({ ficha_id: fichaId, tipo: 'talentos', valor: JSON.stringify(talentos) }, { onConflict: 'ficha_id,tipo' });
}

async function carregarTalentosNuvem() {
    const fichaId = getFichaId();
    if (!fichaId || !window._supaClient) return null;
    const { data } = await window._supaClient.from('fichas_dados')
        .select('valor').eq('ficha_id', fichaId).eq('tipo', 'talentos').maybeSingle();
    if (!data) return null;
    try { return JSON.parse(data.valor); } catch(e) { return null; }
}

// ── Salvar/carregar status via Supabase ───────────────────
async function carregarStatusNuvem() {
    const fichaId = getFichaId();
    if (!fichaId || !window._supaClient) return null;
    const { data } = await window._supaClient.from('fichas_dados')
        .select('valor').eq('ficha_id', fichaId).eq('tipo', 'status').maybeSingle();
    if (!data) return null;
    try { return JSON.parse(data.valor); } catch(e) { return null; }
}

// ── Atributos ─────────────────────────────────────────────
const ATRIBUTOS = [
    { key: 'forca',        label: '⚔️ Força'        },
    { key: 'velocidade',   label: '💨 Velocidade'    },
    { key: 'inteligencia', label: '🧠 Inteligência'  },
    { key: 'defesa',       label: '🛡️ Defesa'        },
    { key: 'pontaria',     label: '🎯 Pontaria'      },
    { key: 'carisma',      label: '🗣️ Carisma'       },
    { key: 'furtividade',  label: '🌑 Furtividade'   },
];

const STATUS = { vida: { atual: 0, max: 0 }, mana: { atual: 0, max: 0 }, sanidade: { atual: 100, max: 100 } };

// ── Controle para não disparar toast na carga inicial ────
let _statusCarregado = false;

// ── Toast de mudança de status em tempo real ─────────────
function notificarMudancaStatus(tipo, anterior, novo) {
    if (!_statusCarregado) return;
    if (anterior === novo || isNaN(anterior) || isNaN(novo)) return;

    const diff  = novo - anterior;
    const sinal = diff > 0 ? '+' : '';

    const CONFIG = {
        vida: { emoji: '❤️', label: 'HP Máximo',   cor: '#e07b39', corBg: 'rgba(224,123,57,0.12)', corBorda: 'rgba(224,123,57,0.5)'  },
        mana: { emoji: '💧', label: 'Mana Máxima', cor: '#00bfff', corBg: 'rgba(0,191,255,0.10)',  corBorda: 'rgba(0,191,255,0.45)'  },
    };
    const c = CONFIG[tipo];
    if (!c) return;

    // Remove toast anterior do mesmo tipo
    const toastAntigo = document.getElementById(`_toast_status_${tipo}`);
    if (toastAntigo) {
        clearTimeout(toastAntigo._timer);
        toastAntigo.remove();
    }

    const corDiff = diff > 0 ? '#4CAF50' : '#e74c3c';

    const toast = document.createElement('div');
    toast.id = `_toast_status_${tipo}`;
    toast.style.cssText = `
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(14px);
        background: ${c.corBg};
        border: 1px solid ${c.corBorda};
        border-left: 4px solid ${c.cor};
        border-radius: 10px;
        padding: 12px 18px 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 8px 28px rgba(0,0,0,0.80);
        z-index: 9990;
        min-width: 230px;
        max-width: 320px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.22s ease, transform 0.22s ease;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
    `;
    toast.innerHTML = `
        <span style="font-size:26px;line-height:1;flex-shrink:0">${c.emoji}</span>
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-size:10px;font-weight:bold;color:#888;text-transform:uppercase;letter-spacing:.6px">${c.label} alterado</span>
            <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
                <span style="font-size:14px;font-weight:bold;color:#aaa;text-decoration:line-through;opacity:.7">${anterior}</span>
                <span style="font-size:11px;color:#555">→</span>
                <span style="font-size:18px;font-weight:bold;color:${c.cor}">${novo}</span>
                <span style="font-size:12px;font-weight:bold;color:${corDiff};background:rgba(0,0,0,0.3);border-radius:4px;padding:1px 5px">${sinal}${diff}</span>
            </div>
        </div>
    `;

    document.body.appendChild(toast);

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            toast.style.opacity   = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
        });
    });

    toast._timer = setTimeout(() => {
        toast.style.opacity   = '0';
        toast.style.transform = 'translateX(-50%) translateY(8px)';
        setTimeout(() => { if (toast.parentNode) toast.remove(); }, 280);
    }, 3200);
}

async function carregarStatus() {
    let d = await carregarStatusNuvem();
    if (!d) { try { d = JSON.parse(localStorage.getItem(k('rpg_dados')) || '{}'); } catch(e) {} }
    if (!d) return;
    STATUS.vida.atual     = parseFloat(d.vidaAtual     ?? d.vida_atual     ?? 0);
    STATUS.mana.atual     = parseFloat(d.manaAtual     ?? d.mana_atual     ?? 0);
    STATUS.sanidade.atual = parseFloat(d.sanAtual      ?? d.sanidade_atual ?? 0);

    // Bases vindas do index.html
    const defBase = parseInt(d.defBase ?? 0);
    const intBase = parseInt(d.intBase ?? 0);

    // Inclui buffs dos talentos ativos no cálculo de vida/mana máximas
    const bases = {
        forca: d.forcaBase || 0, velocidade: d.velBase || 0,
        inteligencia: intBase, defesa: defBase,
        pontaria: d.pontBase || 0, carisma: d.carBase || 0,
        furtividade: d.furtBase || 0
    };
    const buffs = await calcularBuffsTotais(bases);
    const defTotal = defBase + (buffs.defesa || 0);
    const intTotal = intBase + (buffs.inteligencia || 0);

    const novaVidaMax = 50 + (defTotal * 50) || 100;
    const novaManaMax = (intTotal * 10) || 10;

    const vidaAnterior = STATUS.vida.max;
    const manaAnterior = STATUS.mana.max;

    STATUS.vida.max     = novaVidaMax;
    STATUS.mana.max     = novaManaMax;
    STATUS.sanidade.max = 100;

    // Notifica mudanças em tempo real (só após carga inicial)
    notificarMudancaStatus('vida', vidaAnterior, novaVidaMax);
    notificarMudancaStatus('mana', manaAnterior, novaManaMax);

    renderizarStatus();
}

function renderizarStatus() {
    const mapa = { vida: { sufixo: 'hp', bar: 'barra-hp' }, mana: { sufixo: 'mp', bar: 'barra-mp' }, sanidade: { sufixo: 'san', bar: 'barra-san' } };
    Object.entries(mapa).forEach(([tipo, { sufixo, bar }]) => {
        const s = STATUS[tipo];
        const elVal = document.getElementById(`display-${sufixo}`);
        const elBar = document.getElementById(bar);
        if (elVal) elVal.textContent = `${s.atual} / ${s.max}`;
        if (elBar && s.max > 0) elBar.style.width = `${Math.max(0, Math.min(100, (s.atual / s.max) * 100))}%`;
    });
}

async function salvarStatus() {
    const fichaId = getFichaId();

    // 1) Salva snapshot rápido no localStorage (fallback)
    localStorage.setItem(k('rpg_status'), JSON.stringify({
        vidaAtual: STATUS.vida.atual, vidaMax: STATUS.vida.max,
        manaAtual: STATUS.mana.atual, manaMax: STATUS.mana.max,
        sanidadeAtual: STATUS.sanidade.atual, sanidadeMax: STATUS.sanidade.max
    }));

    if (!fichaId || !window._supaClient) return;

    // 2) Lê o registro 'status' já existente para não sobrescrever campos do index.html
    const { data: existente } = await window._supaClient.from('fichas_dados')
        .select('valor').eq('ficha_id', fichaId).eq('tipo', 'status').maybeSingle();

    let base = {};
    try { base = JSON.parse(existente?.valor || '{}'); } catch(e) {}

    // 3) Atualiza apenas os campos de atual/max — preserva atributos e demais campos
    const atualizado = {
        ...base,
        vidaAtual:     STATUS.vida.atual,
        vidaMax:       STATUS.vida.max,
        manaAtual:     STATUS.mana.atual,
        manaMax:       STATUS.mana.max,
        sanAtual:      STATUS.sanidade.atual,
        sanidadeMax:   STATUS.sanidade.max,
    };

    await window._supaClient.from('fichas_dados')
        .upsert({ ficha_id: fichaId, tipo: 'status', valor: JSON.stringify(atualizado) }, { onConflict: 'ficha_id,tipo' });
}

function aplicarCalculo(tipo, inputId, feedbackId) {
    const inputEl = document.getElementById(inputId); const fbEl = document.getElementById(feedbackId);
    const texto = inputEl.value.trim(); if (!texto) return;
    const stat = STATUS[tipo];
    let mod = texto.includes('%') ? Math.round((parseFloat(texto.replace('%','')) / 100) * stat.max) : parseInt(texto) || 0;
    const anterior = stat.atual;
    stat.atual = Math.max(0, Math.min(stat.max, stat.atual + mod));
    const diff = stat.atual - anterior;
    if (fbEl) { fbEl.style.color = diff >= 0 ? '#4CAF50' : '#e74c3c'; fbEl.textContent = `${diff >= 0 ? '+' : ''}${diff} → ${stat.atual}`; }
    inputEl.value = '';
    renderizarStatus();
    salvarStatus(); // agora async — persiste na nuvem
    if (fbEl) setTimeout(() => { fbEl.textContent = ''; }, 2500);
}

async function calcularBuffsTotais(bases) {
    const totais = {};
    ATRIBUTOS.forEach(a => totais[a.key] = 0);
    try {
        let talentos = await carregarTalentosNuvem();
        if (!talentos) talentos = JSON.parse(localStorage.getItem(k('rpg_talentos')) || '[]');
        talentos.forEach(t => {
            if (!t.ativo) return;
            ATRIBUTOS.forEach(a => {
                const valStr = t.buffs?.[a.key] || '';
                if (!valStr) return;
                const baseVal = parseInt(bases[a.key] ?? 0);
                if (valStr.includes('%')) {
                    const pct = parseFloat(valStr.replace('%', ''));
                    if (!isNaN(pct)) totais[a.key] += Math.round((pct / 100) * baseVal);
                } else {
                    const num = parseInt(valStr);
                    if (!isNaN(num)) totais[a.key] += num;
                }
            });
        });
    } catch(e) {}
    return totais;
}

async function renderizarAtributos() {
    let bases = {};
    try {
        let d = await carregarStatusNuvem();
        if (!d) d = JSON.parse(localStorage.getItem(k('rpg_dados')) || '{}');
        if (d) {
            bases = {
                forca: d.forcaBase || 0, velocidade: d.velBase || 0,
                inteligencia: d.intBase || 0, defesa: d.defBase || 0,
                pontaria: d.pontBase || 0, carisma: d.carBase || 0,
                furtividade: d.furtBase || 0
            };
        }
    } catch(e) {}
    const buffs = await calcularBuffsTotais(bases);
    const container = document.getElementById('attr-resumo');
    if (!container) return;
    container.innerHTML = ATRIBUTOS.map(a => {
        const base = parseInt(bases[a.key] ?? 0); const buff = buffs[a.key] || 0; const total = base + buff;
        const buffTxt = buff > 0 ? `+${buff} buff` : buff < 0 ? `${buff} buff` : '';
        const buffCor = buff > 0 ? '#ffd700' : buff < 0 ? '#e74c3c' : 'transparent';
        return `<div class="attr-chip"><div class="a-nome">${a.label}</div><div class="a-val">${total}</div><div class="a-base" style="color:#5a82b5">base ${base}</div><div class="a-buff" style="color:${buffCor}">${buffTxt || '—'}</div></div>`;
    }).join('');
}

// ════════════════════════════════════════════════════════════
//  Cards de Talentos — com Categoria e Raça
// ════════════════════════════════════════════════════════════
let contador = 0;

// Aplica classe CSS de cor conforme categoria
function aplicarEstiloCategoria(card, cat) {
    card.classList.remove('cat-talento', 'cat-habilidade', 'cat-raca');
    if (cat === 'Talento')    card.classList.add('cat-talento');
    if (cat === 'Habilidade') card.classList.add('cat-habilidade');
    if (cat === 'Raça')       card.classList.add('cat-raca');
}

function adicionarTalento(dados = {}) {
    contador++;
    const id    = contador;
    const ativo = dados.ativo !== undefined ? dados.ativo : true;
    const cat   = dados.categoria || 'Talento';
    const raca  = dados.raca || '';
    const classe = dados.classe || '';

    const card = document.createElement('div');
    card.className = `talento-card ${ativo ? 'ativo' : 'inativo'}`;
    card.dataset.id = id;
    aplicarEstiloCategoria(card, cat);

    const buffLinhas = ATRIBUTOS.map(a => `
        <div class="buff-row">
            <span class="b-label">${a.label}</span>
            <input type="text" class="buff-input" id="buff-${a.key}-${id}" value="${dados.buffs?.[a.key] || ''}" placeholder="+10%" inputmode="decimal" oninput="atualizarBuffs()" title="Bônus de ${a.label} deste talento">
        </div>`).join('');

    const calcLinhas = [
        { tipo: 'vida',     icone: '❤️', label: 'Vida',   cor: '#ff6b6b' },
        { tipo: 'mana',     icone: '💧', label: 'Mana',   cor: '#5dade2' },
        { tipo: 'sanidade', icone: '🧠', label: 'Sanid.', cor: '#d7bde2' }
    ].map(({ tipo, icone, label, cor }) => `
        <div class="calc-row">
            <span class="c-label" style="color:${cor}">${icone} ${label}</span>
            <input type="text" id="calc-${tipo}-${id}" placeholder="+10, -5%" inputmode="decimal">
            <button class="btn-aplicar" onclick="aplicarCalculo('${tipo}','calc-${tipo}-${id}','fb-${tipo}-${id}')">Aplicar</button>
        </div><div class="feedback-calc" id="fb-${tipo}-${id}"></div>`).join('');

    card.innerHTML = `
        <div class="talento-header">
            <div class="toggle-ativo ${ativo ? 'on' : ''}" id="toggle-${id}" onclick="toggleAtivo(${id})" title="${ativo ? 'Ativo' : 'Inativo'}"></div>
            <input type="text" class="talento-nome" placeholder="Nome do Talento..." value="${dados.nome || ''}" oninput="salvarTalentos()">

            <!-- Categoria: Talento / Habilidade / Raça -->
            <select class="cat-badge cat-${cat.toLowerCase()}" id="cat-${id}"
                    title="Categoria"
                    onchange="onCatChange(this, ${id})">
                <option value="Talento"    ${cat === 'Talento'    ? 'selected' : ''}>🌟 Talento</option>
                <option value="Habilidade" ${cat === 'Habilidade' ? 'selected' : ''}>⚡ Habilidade</option>
                <option value="Raça"       ${cat === 'Raça'       ? 'selected' : ''}>🧬 Raça</option>
            </select>

            <!-- Tipo: Passivo / Ativo / Reação / Especial -->
            <select class="tipo-badge" id="tipo-${id}" onchange="salvarTalentos()">
                <option value="Passivo"  ${(dados.tipo||'Passivo') === 'Passivo'  ? 'selected' : ''}>Passivo</option>
                <option value="Ativo"    ${(dados.tipo||'')        === 'Ativo'    ? 'selected' : ''}>Ativo</option>
                <option value="Reação"   ${(dados.tipo||'')        === 'Reação'   ? 'selected' : ''}>Reação</option>
                <option value="Especial" ${(dados.tipo||'')        === 'Especial' ? 'selected' : ''}>Especial</option>
            </select>

            <button class="btn-ia" id="btn-ia-${id}" onclick="analisarTalentoComIA(${id})" title="Analisar descrição com IA e extrair buffs automaticamente">🤖 IA</button>
            <button class="btn-remover" onclick="removerTalento(${id})" title="Remover talento">✕</button>
        </div>

        <!-- Resultado da análise de IA -->
        <div class="ia-resultado" id="ia-resultado-${id}"></div>

        <!-- Campo de raça vinculada ao talento/habilidade -->
        <div class="raca-row" id="raca-row-${id}">
            <label>🧬 Raça:</label>
            <input type="text" class="raca-input" id="raca-${id}"
                   value="${raca}"
                   placeholder="Ex: Elfo, Humano, Anão... (deixe vazio se for geral)"
                   list="raca-datalist-${id}"
                   oninput="salvarTalentos(); atualizarTagsRaca()">
            <datalist id="raca-datalist-${id}"></datalist>
        </div>

        <!-- Campo de classe vinculada ao talento/habilidade -->
        <div class="classe-row" id="classe-row-${id}">
            <label>🗡️ Classe:</label>
            <input type="text" class="classe-input" id="classe-${id}"
                   value="${classe}"
                   placeholder="Ex: Guerreiro, Mago, Ladino... (deixe vazio se for geral)"
                   list="classe-datalist-${id}"
                   oninput="salvarTalentos(); atualizarTagsClasse()">
            <datalist id="classe-datalist-${id}"></datalist>
        </div>

        <div class="talento-body">
            <textarea class="talento-desc" placeholder="Descreva o efeito, condições de uso, custo, narrativa..." oninput="salvarTalentos()">${dados.desc || ''}</textarea>
            <div class="buff-panel">
                <div class="buff-panel-title">📊 Buff nos Atributos</div>
                ${buffLinhas}
                <div class="buff-dinamico-badge" id="buff-dinamico-${id}">${dados.buffDinamico ? dados.buffDinamico : ''}</div>
                <div class="calc-secao">
                    <div class="buff-panel-title">⚡ Efeito no Status</div>
                    ${calcLinhas}
                </div>
            </div>
        </div>`;

    document.getElementById('lista-talentos').appendChild(card);

    // Restaura badge de buff dinâmico salvo
    if (dados.buffDinamico) {
        const bdEl = document.getElementById(`buff-dinamico-${id}`);
        if (bdEl) {
            bdEl.textContent = dados.buffDinamico;
            bdEl.classList.add('visivel');
            if (dados.buffDinamicoConfig) bdEl.dataset.config = JSON.stringify(dados.buffDinamicoConfig);
        }
    }

    // Preenche datalist com raças já usadas em outros cards
    atualizarDatalistsRaca();
    atualizarDatalistsClasse();
    salvarTalentos();
}

// Atualiza estilo visual do select de categoria ao mudar
function onCatChange(select, id) {

function atualizarBuffs() { salvarTalentos(); renderizarAtributos(); recalcularStatusComToast(); }

// Recalcula vida/mana máx com os buffs actuais dos cards
// e exibe o toast se houver mudança — sem recarregar da rede.
async function recalcularStatusComToast() {
    let d = null;
    try {
        d = await carregarStatusNuvem();
        if (!d) d = JSON.parse(localStorage.getItem(k('rpg_dados')) || '{}');
    } catch(e) {}
    if (!d) return;

    const defBase = parseInt(d.defBase ?? 0);
    const intBase = parseInt(d.intBase ?? 0);
    const bases   = {
        forca: d.forcaBase || 0, velocidade: d.velBase || 0,
        inteligencia: intBase,   defesa: defBase,
        pontaria: d.pontBase || 0, carisma: d.carBase || 0,
        furtividade: d.furtBase || 0
    };

    // Calcula buffs diretamente dos cards visíveis (sem nova chamada à rede)
    const buffsLocais = {};
    ATRIBUTOS.forEach(a => buffsLocais[a.key] = 0);
    document.querySelectorAll('.talento-card').forEach(card => {
        const id    = card.dataset.id;
        const ativo = document.getElementById(`toggle-${id}`)?.classList.contains('on');
        if (!ativo) return;
        ATRIBUTOS.forEach(a => {
            const valStr = document.getElementById(`buff-${a.key}-${id}`)?.value.trim() || '';
            if (!valStr) return;
            const baseVal = parseInt(bases[a.key] ?? 0);
            if (valStr.includes('%')) {
                const pct = parseFloat(valStr.replace('%', ''));
                if (!isNaN(pct)) buffsLocais[a.key] += Math.round((pct / 100) * baseVal);
            } else {
                const num = parseInt(valStr);
                if (!isNaN(num)) buffsLocais[a.key] += num;
            }
        });
    });

    const defTotal = defBase + (buffsLocais.defesa || 0);
    const intTotal = intBase + (buffsLocais.inteligencia || 0);

    const novaVidaMax = 50 + (defTotal * 50) || 100;
    const novaManaMax = (intTotal * 10) || 10;

    const vidaAnterior = STATUS.vida.max;
    const manaAnterior = STATUS.mana.max;

    STATUS.vida.max = novaVidaMax;
    STATUS.mana.max = novaManaMax;

    notificarMudancaStatus('vida', vidaAnterior, novaVidaMax);
    notificarMudancaStatus('mana', manaAnterior, novaManaMax);

    renderizarStatus();
}

function coletarTalentos() {
    return Array.from(document.querySelectorAll('.talento-card')).map(card => {
        const id    = card.dataset.id;
        const ativo = document.getElementById(`toggle-${id}`)?.classList.contains('on') ?? true;
        const buffs = {};
        ATRIBUTOS.forEach(a => { buffs[a.key] = document.getElementById(`buff-${a.key}-${id}`)?.value.trim() || ''; });

        // Preserva buffs dinâmicos gerados pela IA
        const bdEl    = document.getElementById(`buff-dinamico-${id}`);
        const bdConf  = bdEl?.dataset.config ? JSON.parse(bdEl.dataset.config) : null;

        return {
            id,
            ativo,
            buffs,
            nome:            card.querySelector('.talento-nome')?.value || '',
            tipo:            document.getElementById(`tipo-${id}`)?.value || 'Passivo',
            categoria:       document.getElementById(`cat-${id}`)?.value  || 'Talento',
            raca:            document.getElementById(`raca-${id}`)?.value.trim() || '',
            classe:          document.getElementById(`classe-${id}`)?.value.trim() || '',
            desc:            card.querySelector('.talento-desc')?.value || '',
            buffDinamico:    bdEl?.textContent.trim() || '',
            buffDinamicoConfig: bdConf,
        };
    });
}

// ════════════════════════════════════════════════════════════
//  ANÁLISE DE BUFFS COM IA (Claude API)
// ════════════════════════════════════════════════════════════
async function analisarTalentoComIA(id) {
    const descEl = document.querySelector(`.talento-card[data-id="${id}"] .talento-desc`);
    const nomeEl = document.querySelector(`.talento-card[data-id="${id}"] .talento-nome`);
    const btnIA  = document.getElementById(`btn-ia-${id}`);
    const resEl  = document.getElementById(`ia-resultado-${id}`);

    const desc = descEl?.value?.trim();
    const nome = nomeEl?.value?.trim() || 'Talento';

    if (!desc) {
        resEl.className = 'ia-resultado visivel';
        resEl.innerHTML = `<div class="ia-erro">⚠️ Escreva uma descrição para o talento antes de analisar.</div>`;
        return;
    }

    btnIA.disabled = true;
    btnIA.classList.add('carregando');
    btnIA.textContent = '⏳ Analisando...';
    resEl.className = 'ia-resultado visivel';
    resEl.innerHTML = `<div style="color:#888;font-size:12px;">🤖 Lendo a descrição e extraindo os buffs...</div>`;

    const atributosLista = ATRIBUTOS.map(a => a.key).join(', ');

    const prompt = `Você é um sistema de RPG. Analise a descrição do talento abaixo e extraia os buffs/bônus que ele fornece nos atributos.

TALENTO: "${nome}"
DESCRIÇÃO: "${desc}"

ATRIBUTOS DISPONÍVEIS: ${atributosLista}

Responda APENAS com JSON válido, sem explicações, sem markdown, sem backticks. Formato exato:
{
  "buffsFixos": {
    "forca": "+2",
    "defesa": "10%"
  },
  "buffsDinamicos": [
    {
      "atributo": "forca",
      "formula": "mana/50",
      "descricao": "+1 de força a cada 50 de mana máxima",
      "tipo": "mana_para_atributo",
      "divisor": 50,
      "valorPorDivisor": 1
    }
  ],
  "buffsCondicional": "+1 all",
  "resumo": "Texto curto descrevendo os buffs identificados"
}

Regras:
- buffsFixos: bônus estáticos que sempre se aplicam. Use "+N" para fixo ou "N%" para porcentagem.
- buffsDinamicos: bônus que dependem de outro valor (ex: a cada X de mana, por kill, por turno). Inclua "tipo" que pode ser: "mana_para_atributo", "kills_para_atributo", "turnos_para_atributo", "percentual_crescente", "multiplicador_mestre".
- buffsCondicional: se tiver "+1 all" ou bônus em todos, coloque aqui como string.
- Se não houver um tipo de buff, use objeto vazio {} ou array vazio [].
- Se a descrição menciona "o mestre define" ou "variável", coloque tipo "multiplicador_mestre".
- Para Contador de Kills: tipo "kills_para_atributo", inclua campo "killsPorBuff" com o número de kills necessários.
- Para buffs por turno: tipo "turnos_para_atributo", inclua "turnosPorBuff" e "maxPorcentagem" se houver máximo.`;

    try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [{ role: 'user', content: prompt }]
            })
        });

        const data = await response.json();
        const texto = data.content?.map(c => c.text || '').join('') || '';

        let resultado;
        try {
            const clean = texto.replace(/```json|```/g, '').trim();
            resultado = JSON.parse(clean);
        } catch(e) {
            throw new Error('Resposta inválida da IA: ' + texto.substring(0, 100));
        }

        renderizarResultadoIA(id, resultado);

    } catch(err) {
        resEl.className = 'ia-resultado visivel';
        resEl.innerHTML = `<div class="ia-erro">❌ Erro ao analisar: ${err.message}</div>`;
    } finally {
        btnIA.disabled = false;
        btnIA.classList.remove('carregando');
        btnIA.innerHTML = '🤖 IA';
    }
}

function renderizarResultadoIA(id, resultado) {
    const resEl = document.getElementById(`ia-resultado-${id}`);
    if (!resEl) return;

    const { buffsFixos = {}, buffsDinamicos = [], buffsCondicional = '', resumo = '' } = resultado;

    let html = `<div class="ia-titulo">🤖 Buffs identificados pela IA</div>`;

    if (resumo) html += `<div style="color:#aaa;font-size:11px;margin-bottom:8px;font-style:italic;">${resumo}</div>`;

    // Buffs fixos
    const fixosEntries = Object.entries(buffsFixos).filter(([,v]) => v && v !== '0');
    if (fixosEntries.length > 0) {
        html += `<div style="color:#c8aa6e;font-size:10px;font-weight:bold;text-transform:uppercase;margin-bottom:4px;">Buffs Fixos:</div>`;
        fixosEntries.forEach(([attr, val]) => {
            const label = ATRIBUTOS.find(a => a.key === attr)?.label || attr;
            html += `<div class="ia-buff-item"><span class="ia-buff-nome">${label}</span><span class="ia-buff-val">${val}</span></div>`;
        });
    }

    // Buff +1 all
    if (buffsCondicional) {
        html += `<div class="ia-buff-item"><span class="ia-buff-nome">Todos</span><span class="ia-buff-val">${buffsCondicional}</span><span class="ia-buff-tipo">(todos os atributos)</span></div>`;
    }

    // Buffs dinâmicos
    if (buffsDinamicos.length > 0) {
        html += `<div style="color:#00bfff;font-size:10px;font-weight:bold;text-transform:uppercase;margin:8px 0 4px;">Buffs Dinâmicos:</div>`;
        buffsDinamicos.forEach(bd => {
            html += `<div class="ia-dinamico">🔄 ${bd.descricao || bd.formula}</div>`;
        });
    }

    const temBuffs = fixosEntries.length > 0 || buffsDinamicos.length > 0 || buffsCondicional;

    if (!temBuffs) {
        html += `<div style="color:#666;font-size:11px;">Nenhum buff numérico identificado. A descrição pode ser narrativa ou condicional.</div>`;
    }

    if (temBuffs) {
        html += `<button class="ia-aplicar" onclick="aplicarBuffsIA(${id}, ${JSON.stringify(JSON.stringify(resultado))})">✅ Aplicar buffs nos campos</button>`;
    }

    resEl.className = 'ia-resultado visivel';
    resEl.innerHTML = html;
}

function aplicarBuffsIA(id, resultadoJson) {
    const resultado = JSON.parse(resultadoJson);
    const { buffsFixos = {}, buffsDinamicos = [], buffsCondicional = '' } = resultado;

    // Aplica buffs fixos nos inputs
    ATRIBUTOS.forEach(a => {
        const inputEl = document.getElementById(`buff-${a.key}-${id}`);
        if (!inputEl) return;

        let valor = buffsFixos[a.key] || '';

        // Se tem +1 all, soma ao valor existente
        if (buffsCondicional && buffsCondicional.toLowerCase().includes('all')) {
            const allNum = parseInt(buffsCondicional.replace(/[^0-9\-+]/g, '')) || 1;
            const atual  = parseInt(inputEl.value) || 0;
            valor = String(atual + allNum);
        }

        if (valor && valor !== '0') inputEl.value = valor;
    });

    // Armazena config de buffs dinâmicos no badge
    const bdEl = document.getElementById(`buff-dinamico-${id}`);
    if (bdEl && buffsDinamicos.length > 0) {
        const textos = buffsDinamicos.map(bd => `🔄 ${bd.descricao}`).join(' | ');
        bdEl.textContent = textos;
        bdEl.dataset.config = JSON.stringify(buffsDinamicos);
        bdEl.classList.add('visivel');
    }

    atualizarBuffs();

    // Feedback
    const resEl = document.getElementById(`ia-resultado-${id}`);
    if (resEl) {
        const aplicarBtn = resEl.querySelector('.ia-aplicar');
        if (aplicarBtn) { aplicarBtn.textContent = '✅ Aplicado!'; aplicarBtn.disabled = true; }
    }

    salvarTalentos();
}

async function salvarTalentos() {
    const talentos = coletarTalentos();
    await salvarNuvemTalentos(talentos);
}

async function carregarTalentos() {
    let dados = await carregarTalentosNuvem();
    if (!dados) { try { dados = JSON.parse(localStorage.getItem(k('rpg_talentos')) || '[]'); } catch(e) { dados = []; } }
    if (dados.length === 0) adicionarTalento();
    else dados.forEach(d => adicionarTalento(d));
}

async function salvar() { await salvarTalentos(); mostrarToast('💾 Talentos salvos!'); }
function mostrarToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

// ════════════════════════════════════════════════════════════
//  FILTROS
// ════════════════════════════════════════════════════════════
let tipoFiltroAtual = 'todos';
let catFiltroAtual  = 'todos';
const buffsAtivos   = new Set();

// ── Filtro de Categoria ───────────────────────────────────
function selecionarCatFiltro(btn) {
    catFiltroAtual = btn.dataset.cat;
    document.querySelectorAll('.btn-cat-filtro').forEach(b => b.classList.toggle('active', b === btn));
    filtrarTalentos();
}

// ── Filtro de Tipo ────────────────────────────────────────
function selecionarTipo(btn) {
    tipoFiltroAtual = btn.dataset.tipo;
    document.querySelectorAll('.btn-tipo-filtro').forEach(b => b.classList.toggle('active', b === btn));
    filtrarTalentos();
}

// ── Filtro de Buff ────────────────────────────────────────
function gerarBotoesBuff() {
    const wrap = document.getElementById('filtro-buff-wrap');
    if (!wrap) return;
    wrap.innerHTML = ATRIBUTOS.map(a => `
        <button class="btn-buff-filtro" data-key="${a.key}" onclick="toggleBuffFiltro(this)">
            <span class="check"></span>${a.label}
        </button>`).join('');
}

function toggleBuffFiltro(btn) {
    const key = btn.dataset.key;
    if (buffsAtivos.has(key)) { buffsAtivos.delete(key); btn.classList.remove('active'); btn.querySelector('.check').textContent = ''; }
    else { buffsAtivos.add(key); btn.classList.add('active'); btn.querySelector('.check').textContent = '✓'; }
    filtrarTalentos();
}

// ── Tags de raça ──────────────────────────────────────────
function coletarRacasUnicas() {
    const racas = new Set();
    document.querySelectorAll('.talento-card:not(.oculto-permanente)').forEach(card => {
        const id   = card.dataset.id;
        const raca = document.getElementById(`raca-${id}`)?.value.trim();
        if (raca) racas.add(raca);
    });
    return [...racas].sort((a, b) => a.localeCompare(b));
}

function atualizarTagsRaca() {
    const racas = coletarRacasUnicas();
    const wrap  = document.getElementById('raca-sugestoes-filtro');
    if (!wrap) return;

    // Lê o filtro atual para manter estados ativos
    const filtroAtual = (document.getElementById('inputFiltroRaca')?.value || '').toLowerCase().trim();

    wrap.innerHTML = racas.map(r => {
        const isActive = filtroAtual && r.toLowerCase().includes(filtroAtual);
        return `<span class="raca-tag ${isActive ? 'active' : ''}" onclick="clicarTagRaca(this, '${r.replace(/'/g, "\\'")}')">${r}</span>`;
    }).join('');

    // Oculta a linha de tags se não houver raças
    const linhaWrap = document.getElementById('linha-tags-raca');
    if (linhaWrap) linhaWrap.style.display = racas.length === 0 ? 'none' : '';

    // Atualiza os datalists dos cards
    atualizarDatalistsRaca(racas);
}

function atualizarDatalistsRaca(racas) {
    if (!racas) racas = coletarRacasUnicas();
    document.querySelectorAll('[id^="raca-datalist-"]').forEach(dl => {
        dl.innerHTML = racas.map(r => `<option value="${r}">`).join('');
    });
}

function clicarTagRaca(tag, valor) {
    const input = document.getElementById('inputFiltroRaca');
    if (!input) return;
    // Toggle: se já está filtrado por esse valor, limpa; senão aplica
    if (input.value.trim().toLowerCase() === valor.toLowerCase()) {
        input.value = '';
    } else {
        input.value = valor;
    }
    filtrarTalentos();
    atualizarTagsRaca();
}

function limparFiltroRaca() {
    const input = document.getElementById('inputFiltroRaca');
    if (input) input.value = '';
    filtrarTalentos();
    atualizarTagsRaca();
}

// ── Tags de Classe ────────────────────────────────────────
function coletarClassesUnicas() {
    const classes = new Set();
    document.querySelectorAll('.talento-card:not(.oculto-permanente)').forEach(card => {
        const id     = card.dataset.id;
        const classe = document.getElementById(`classe-${id}`)?.value.trim();
        if (classe) classes.add(classe);
    });
    return [...classes].sort((a, b) => a.localeCompare(b));
}

function atualizarTagsClasse() {
    const classes = coletarClassesUnicas();
    const wrap    = document.getElementById('classe-sugestoes-filtro');
    if (!wrap) return;

    const filtroAtual = (document.getElementById('inputFiltroClasse')?.value || '').toLowerCase().trim();

    wrap.innerHTML = classes.map(c => {
        const isActive = filtroAtual && c.toLowerCase().includes(filtroAtual);
        return `<span class="classe-tag ${isActive ? 'active' : ''}" onclick="clicarTagClasse(this, '${c.replace(/'/g, "\\'")}')">${c}</span>`;
    }).join('');

    const linhaWrap = document.getElementById('linha-tags-classe');
    if (linhaWrap) linhaWrap.style.display = classes.length === 0 ? 'none' : '';

    atualizarDatalistsClasse(classes);
}

function atualizarDatalistsClasse(classes) {
    if (!classes) classes = coletarClassesUnicas();
    document.querySelectorAll('[id^="classe-datalist-"]').forEach(dl => {
        dl.innerHTML = classes.map(c => `<option value="${c}">`).join('');
    });
}

function clicarTagClasse(tag, valor) {
    const input = document.getElementById('inputFiltroClasse');
    if (!input) return;
    if (input.value.trim().toLowerCase() === valor.toLowerCase()) {
        input.value = '';
    } else {
        input.value = valor;
    }
    filtrarTalentos();
    atualizarTagsClasse();
}

function limparFiltroClasse() {
    const input = document.getElementById('inputFiltroClasse');
    if (input) input.value = '';
    filtrarTalentos();
    atualizarTagsClasse();
}

// ── Filtro principal (combina todos os critérios) ─────────
function filtrarTalentos() {
    const termo       = (document.getElementById('inputPesquisaTalento')?.value || '').toLowerCase().trim();
    const termoRaca   = (document.getElementById('inputFiltroRaca')?.value      || '').toLowerCase().trim();
    const termoClasse = (document.getElementById('inputFiltroClasse')?.value    || '').toLowerCase().trim();
    const cards       = document.querySelectorAll('.talento-card');
    let visiveis = 0;

    cards.forEach(card => {
        const id     = card.dataset.id;
        const nome   = (card.querySelector('.talento-nome')?.value || '').toLowerCase();
        const desc   = (card.querySelector('.talento-desc')?.value || '').toLowerCase();
        const tipo   = document.getElementById(`tipo-${id}`)?.value   || '';
        const cat    = document.getElementById(`cat-${id}`)?.value    || '';
        const raca   = (document.getElementById(`raca-${id}`)?.value   || '').toLowerCase().trim();
        const classe = (document.getElementById(`classe-${id}`)?.value || '').toLowerCase().trim();

        const bateTexto  = !termo       || nome.includes(termo)       || desc.includes(termo);
        const bateTipo   = tipoFiltroAtual === 'todos' || tipo === tipoFiltroAtual;
        const bateCat    = catFiltroAtual  === 'todos' || cat  === catFiltroAtual;
        const bateRaca   = !termoRaca   || raca.includes(termoRaca);
        const bateClasse = !termoClasse || classe.includes(termoClasse);

        let bateBuff = true;
        if (buffsAtivos.size > 0) {
            bateBuff = [...buffsAtivos].every(key => {
                const val = document.getElementById(`buff-${key}-${id}`)?.value.trim();
                return val && val !== '0';
            });
        }

        const visivel = bateTexto && bateTipo && bateCat && bateRaca && bateClasse && bateBuff;
        card.classList.toggle('oculto', !visivel);
        if (visivel) visiveis++;
    });

    const total = cards.length;
    const el    = document.getElementById('resultado-pesquisa');
    const temFiltro = termo || tipoFiltroAtual !== 'todos' || catFiltroAtual !== 'todos' || termoRaca || termoClasse || buffsAtivos.size > 0;
    if (el) el.textContent = temFiltro ? `${visiveis} de ${total} talento${total !== 1 ? 's' : ''}` : '';
}

// ── Inicialização ─────────────────────────────────────────
// Talentos PRIMEIRO: carregarStatus() usa calcularBuffsTotais()
// que precisa dos talentos já salvos para calcular vida/mana máximas.
(async () => {
    await carregarTalentos();    // 1º: popula cards (e localStorage dos buffs)
    await renderizarAtributos(); // 2º: chips de atributos com buffs visíveis
    await carregarStatus();      // 3º: vida/mana máx já consideram buffs ativos
    gerarBotoesBuff();
    atualizarTagsRaca();
    atualizarTagsClasse();
    // Só dispara toasts APÓS a carga completa da página
    _statusCarregado = true;
})();
