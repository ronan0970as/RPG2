<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Fichas - RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="painel_de_escolhas_de_fichas.css">
    <link rel="stylesheet" href="ui-enhancements.css">
    <style>
        /* ── Fundo temático ── */
        body {
            background-image:
                linear-gradient(to bottom,rgba(4,2,8,0.42) 0%,rgba(5,3,10,0.34) 50%,rgba(3,2,6,0.50) 100%),
                url('torre_painel.png');
            background-size: cover;
            background-position: center center;
            /* scroll por padrão: sem flickering iOS */
            background-attachment: scroll;
            background-repeat: no-repeat;
        }
        /* fixed apenas em desktop com mouse */
        @media (hover: hover) and (pointer: fine) {
            body { background-attachment: fixed; }
        }

        /* Campo "Outro" — animação de entrada */
        #outro-classe-wrap {
            display: none; flex-direction: column; gap: 4px;
            animation: slideDown 0.2s ease;
        }
        #outro-classe-wrap.visivel { display: flex; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #outro-classe-wrap label {
            font-size: 11px; color: #c8aa6e;
            text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold;
        }
        #outro-classe-input {
            background: #111; border: 1px solid #c8aa6e; color: #fff;
            padding: 10px 12px; border-radius: 6px;
            /* ≥ 16px evita zoom iOS */
            font-size: 16px;
            font-family: inherit; width: 100%; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }
        #outro-classe-input:focus { border-color: #e8c97e; box-shadow: 0 0 0 2px rgba(200,170,110,0.15); }
        #outro-classe-input::placeholder { color: #555; }

        /* Seletor de gênero no modal */
        .genero-btn-modal {
            flex: 1; min-width: 90px;
            background: #111; border: 1px solid #333; color: #666;
            padding: 10px 8px; border-radius: 6px; cursor: pointer;
            font-size: 13px; font-weight: bold; font-family: inherit;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            /* touch target */
            min-height: 44px; white-space: nowrap; text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) and (pointer: fine) {
            .genero-btn-modal:hover { border-color: #c8aa6e; color: #c8aa6e; background: rgba(200,170,110,0.07); }
        }
        .genero-btn-modal:active { border-color: #c8aa6e; color: #c8aa6e; }
        .genero-btn-modal.ativo {
            background: rgba(200,170,110,0.15);
            border-color: #c8aa6e; color: #c8aa6e;
            box-shadow: 0 0 0 1px rgba(200,170,110,0.3);
        }

        .card-genero { font-size: 11px; opacity: 0.75; margin-left: 2px; }

        /* ── MODAL: logout ── */
        #modal-logout {
            position: fixed; inset: 0; z-index: 9000;
            background: rgba(0,0,0,0.72);
            display: none; align-items: center; justify-content: center;
            padding: 16px; box-sizing: border-box;
            backdrop-filter: blur(4px);
        }
        #modal-logout.visivel { display: flex; }
        .modal-logout-box {
            background: rgba(16,12,7,0.97);
            border: 1px solid rgba(200,170,110,0.45);
            border-radius: 12px;
            padding: 28px 24px;
            max-width: 360px; width: 100%;
            display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .modal-logout-box h3 {
            font-family: var(--font-heading, 'Cinzel', serif);
            color: #f5d06e; font-size: 15px;
            text-transform: uppercase; letter-spacing: 1.5px;
            margin: 0;
        }
        .modal-logout-box p { color: #9a8e6e; font-size: 14px; margin: 0; line-height: 1.5; }
        .modal-logout-btns { display: flex; gap: 10px; }
        .modal-logout-btns .btn-acao { flex: 1; justify-content: center; min-height: 48px; }
    </style>
</head>
<body>

<!-- Overlay da Sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

<!-- Sidebar lateral -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">
            <span class="sidebar-logo-icone">⚔️</span>
            <span class="sidebar-logo-titulo">Ficha RPG</span>
        </div>
        <button class="sidebar-fechar" onclick="fecharSidebar()" title="Fechar menu" aria-label="Fechar menu">✕</button>
    </div>

    <div class="sidebar-usuario" id="sidebar-usuario-area">
        <div class="sidebar-avatar">👤</div>
        <div class="sidebar-user-info">
            <div class="sidebar-user-nome" id="sidebar-user-nome">—</div>
            <div class="sidebar-user-sub">Conta conectada</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="sidebar-secao-titulo">Navegação</div>
        <a class="sidebar-link ativo" href="painel_de_escolhas_de_fichas.html">
            <span class="sidebar-link-icone">🗂️</span>Minhas Fichas
        </a>
        <div class="sidebar-separador"></div>
        <div class="sidebar-secao-titulo">Ficha Atual</div>
        <a class="sidebar-link" href="index.html">
            <span class="sidebar-link-icone">📊</span>Status do Personagem
        </a>
        <a class="sidebar-link" href="talentos.html">
            <span class="sidebar-link-icone">✨</span>Talentos
        </a>
        <a class="sidebar-link" href="itens.html">
            <span class="sidebar-link-icone">🎒</span>Inventário
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="sidebar-btn-logout" onclick="fecharSidebar(); abrirModalLogout();">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair da conta
        </button>
    </div>
</aside>

<!-- Topo -->
<header class="painel-topo">
    <button class="btn-menu-hamburguer" id="btnHamburguer"
            onclick="abrirSidebar()" title="Menu" aria-label="Abrir menu">
        <span></span><span></span><span></span>
    </button>
    <span class="painel-topo-titulo">⚔️ Fichas RPG</span>
    <div class="painel-topo-spacer"></div>
    <div class="painel-acoes">
        <button class="btn-acao" onclick="abrirModalCriar()">
            ＋ <span class="btn-acao-label">Criar Ficha</span>
        </button>
        <button class="btn-acao secundario" onclick="importarFicha()" title="Importar ficha (JSON, CSV ou TXT)">
            ⬆ <span class="btn-acao-label">Importar</span>
        </button>
        <button class="btn-acao secundario" onclick="baixarTemplateTXT()" title="Baixar template .TXT">
            📄 <span class="btn-acao-label">Template .TXT</span>
        </button>
        <button class="btn-acao secundario" onclick="baixarTemplateCSV()" title="Baixar template .CSV">
            📊 <span class="btn-acao-label">Template .CSV</span>
        </button>
        <button class="btn-usuario-topo" id="btnUsuarioTopo"
                onclick="abrirSidebar()" title="Menu do usuário">
            <div class="avatar-mini">👤</div>
            <span id="topo-user-nome">...</span>
        </button>
    </div>
</header>

<!-- Busca e filtros -->
<div class="painel-filtros-busca">
    <input type="text" id="inputBusca" placeholder="🔍  Pesquisar ficha..." oninput="filtrar()">
    <div class="filtros">
        <button class="btn-filtro active" onclick="filtrarCategoria('todos')">Todos</button>
        <button class="btn-filtro" onclick="filtrarCategoria('Guerreiro')">Guerreiros</button>
        <button class="btn-filtro" onclick="filtrarCategoria('Mago')">Magos</button>
        <button class="btn-filtro" onclick="filtrarCategoria('Assassino')">Assassinos</button>
        <button class="btn-filtro" onclick="filtrarCategoria('Suporte')">Suportes</button>
    </div>
</div>

<!-- Grid de personagens -->
<main class="grid-personagens" id="gridPersonagens">
    <div class="estado-vazio">
        <div class="icone-vazio">⏳</div>
        <p>Carregando fichas...</p>
    </div>
</main>

<!-- Modal — Criar nova ficha -->
<div class="modal-overlay" id="modalCriar" onclick="fecharModalSeFora(event)">
    <div class="modal-box">
        <h2>Nova Ficha</h2>

        <label>Nome do Personagem</label>
        <input type="text" id="novo-nome" placeholder="Ex: Arthur, o Rei">

        <label>Gênero</label>
        <div id="modal-genero-selector" style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="genero-btn-modal" data-genero="Masculino" onclick="selecionarGeneroModal(this)">♂ Masculino</button>
            <button type="button" class="genero-btn-modal" data-genero="Feminino"  onclick="selecionarGeneroModal(this)">♀ Feminino</button>
            <button type="button" class="genero-btn-modal" data-genero="Outro"     onclick="selecionarGeneroModal(this)">⚧ Outro</button>
        </div>

        <label>Classe</label>
        <select id="nova-classe" onchange="toggleOutroClasse()">
            <option value="Guerreiro">⚔️ Guerreiro</option>
            <option value="Mago">🔮 Mago</option>
            <option value="Assassino">🗡️ Assassino</option>
            <option value="Suporte">🛡️ Suporte</option>
            <option value="__outro__">✏️ Outro...</option>
        </select>

        <div id="outro-classe-wrap">
            <label>Digite o nome da classe</label>
            <input type="text" id="outro-classe-input" placeholder="Ex: Paladino, Druida, Necromante...">
        </div>

        <label>Imagem (URL ou deixe em branco)</label>
        <input type="text" id="nova-img" placeholder="https://...">

        <label>Ou carregue uma imagem local:</label>
        <input type="file" id="nova-img-file" accept="image/*" onchange="preCarregarImagem(event)" class="file-input">

        <div class="modal-botoes">
            <button class="btn-acao" onclick="criarFicha()">Criar</button>
            <button class="btn-acao secundario" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal de logout -->
<div id="modal-logout">
    <div class="modal-logout-box">
        <h3>Sair da conta</h3>
        <p>Tem certeza que deseja encerrar a sessão?</p>
        <div class="modal-logout-btns">
            <button class="btn-acao danger" onclick="confirmarLogout()" style="background:rgba(192,57,43,0.2);border-color:#c0392b;color:#e74c3c;">Sair</button>
            <button class="btn-acao secundario" onclick="fecharModalLogout()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Menu de contexto -->
<div class="ctx-menu" id="ctxMenu" style="position:fixed;">
    <button onclick="abrirFichaAtual()">📂 Abrir Ficha</button>
    <button onclick="editarFichaAtual()">✏️ Renomear</button>
    <button onclick="exportarFichaAtual()">📦 Exportar JSON</button>
    <button class="danger" onclick="excluirFichaAtual()">🗑 Excluir</button>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>
    /* ── Sidebar ── */
    function abrirSidebar() {
        document.getElementById('sidebar').classList.add('aberta');
        document.getElementById('sidebarOverlay').classList.add('visivel');
        document.body.style.overflow = 'hidden';
    }
    function fecharSidebar() {
        document.getElementById('sidebar').classList.remove('aberta');
        document.getElementById('sidebarOverlay').classList.remove('visivel');
        document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { fecharSidebar(); fecharModalLogout(); }
    });

    /* ── Modal de logout ── */
    function abrirModalLogout() {
        document.getElementById('modal-logout').classList.add('visivel');
    }
    function fecharModalLogout() {
        document.getElementById('modal-logout').classList.remove('visivel');
    }
    async function confirmarLogout() {
        fecharModalLogout();
        try {
            if (window._supaClient) await window._supaClient.auth.signOut();
        } catch(e) {}
        localStorage.removeItem('rpg_sessao_cache');
        window.location.href = 'auth.html';
    }

    /* ── Preenche nome do usuário na sidebar e no topo ── */
    function preencherUsuarioUI() {
        const sessao = typeof getSessao === 'function' ? getSessao() : null;
        if (!sessao) return;
        const primeiroNome = sessao.nome ? sessao.nome.split(' ')[0] : sessao.email;
        const elSidebar = document.getElementById('sidebar-user-nome');
        const elTopo    = document.getElementById('topo-user-nome');
        if (elSidebar) elSidebar.textContent = sessao.nome || sessao.email;
        if (elTopo)    elTopo.textContent    = primeiroNome;
    }

    /* Não injeta o widget flutuante nesta página (usa a sidebar) */
    window.injetarUsuarioNav = function() { preencherUsuarioUI(); };

    /* ── [BUG-PANEL-1] Inicialização correta: aguarda auth resolver ── */
    exigirLogin().then(() => {
        preencherUsuarioUI();
        if (typeof _iniciarPainel === 'function') _iniciarPainel();
    });
</script>

<script src="painel_de_escolhas_de_fichas.js"></script>

<script>
    /* ── Gênero no modal ── */
    function selecionarGeneroModal(btn) {
        document.querySelectorAll('#modal-genero-selector .genero-btn-modal')
            .forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
    }

    /* ── Campo "Outro" na classe ── */
    function toggleOutroClasse() {
        const sel   = document.getElementById('nova-classe');
        const wrap  = document.getElementById('outro-classe-wrap');
        const input = document.getElementById('outro-classe-input');
        const isOutro = sel.value === '__outro__';
        wrap.classList.toggle('visivel', isOutro);
        if (isOutro) setTimeout(() => input.focus(), 50);
        else input.value = '';
    }

    /* ── Intercepta criarFicha para tratar "Outro" ── */
    const _criarFichaOriginal = criarFicha;
    criarFicha = async function() {
        const sel   = document.getElementById('nova-classe');
        const outro = document.getElementById('outro-classe-input');
        if (sel.value === '__outro__') {
            const nomeClasse = outro.value.trim();
            if (!nomeClasse) {
                outro.focus();
                outro.style.borderColor = '#e74c3c';
                setTimeout(() => outro.style.borderColor = '#c8aa6e', 1500);
                return;
            }
            sel.value = nomeClasse;
            if (!sel.querySelector(`option[value="${nomeClasse}"]`)) {
                const opt = document.createElement('option');
                opt.value = nomeClasse; opt.textContent = nomeClasse; opt.selected = true;
                sel.appendChild(opt);
            }
        }
        await _criarFichaOriginal();
    };
</script>
<script src="ui-enhancements.js"></script>
</body>
</html>
