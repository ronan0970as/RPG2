<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Fichas - RPG</title>
    <link rel="stylesheet" href="painel_de_escolhas_de_fichas.css">
    <style>
        /* Campo "Outro" — animação de entrada */
        #outro-classe-wrap {
            display: none;
            flex-direction: column;
            gap: 4px;
            animation: slideDown 0.2s ease;
        }
        #outro-classe-wrap.visivel { display: flex; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #outro-classe-wrap label {
            font-size: 11px;
            color: #c8aa6e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }
        #outro-classe-input {
            background: #111;
            border: 1px solid #c8aa6e;
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            width: 100%;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }
        #outro-classe-input:focus {
            border-color: #e8c97e;
            box-shadow: 0 0 0 2px rgba(200,170,110,0.15);
        }
        #outro-classe-input::placeholder { color: #555; }

        /* Seletor de gênero no modal */
        .genero-btn-modal {
            flex: 1;
            min-width: 90px;
            background: #111;
            border: 1px solid #333;
            color: #666;
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            min-height: 44px;
            white-space: nowrap;
            text-align: center;
        }
        .genero-btn-modal:hover {
            border-color: #c8aa6e;
            color: #c8aa6e;
            background: rgba(200,170,110,0.07);
        }
        .genero-btn-modal.ativo {
            background: rgba(200,170,110,0.15);
            border-color: #c8aa6e;
            color: #c8aa6e;
            box-shadow: 0 0 0 1px rgba(200,170,110,0.3);
        }

        .card-genero {
            font-size: 11px;
            opacity: 0.75;
            margin-left: 2px;
        }
    </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════
     OVERLAY DA SIDEBAR
════════════════════════════════════════════════════════ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

<!-- ════════════════════════════════════════════════════════
     SIDEBAR LATERAL
════════════════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">

    <!-- Cabeçalho da sidebar -->
    <div class="sidebar-header">
        <div class="sidebar-logo">
            <span class="sidebar-logo-icone">⚔️</span>
            <span class="sidebar-logo-titulo">Ficha RPG</span>
        </div>
        <button class="sidebar-fechar" onclick="fecharSidebar()" title="Fechar menu">✕</button>
    </div>

    <!-- Usuário logado -->
    <div class="sidebar-usuario" id="sidebar-usuario-area">
        <div class="sidebar-avatar">👤</div>
        <div class="sidebar-user-info">
            <div class="sidebar-user-nome" id="sidebar-user-nome">—</div>
            <div class="sidebar-user-sub">Conta conectada</div>
        </div>
    </div>

    <!-- Navegação -->
    <nav class="sidebar-nav">
        <div class="sidebar-secao-titulo">Navegação</div>

        <a class="sidebar-link ativo" href="painel_de_escolhas_de_fichas.html">
            <span class="sidebar-link-icone">🗂️</span>
            Minhas Fichas
        </a>

        <div class="sidebar-separador"></div>
        <div class="sidebar-secao-titulo">Ficha Atual</div>

        <a class="sidebar-link" href="index.html">
            <span class="sidebar-link-icone">📊</span>
            Status do Personagem
        </a>
        <a class="sidebar-link" href="talentos.html">
            <span class="sidebar-link-icone">✨</span>
            Talentos
        </a>
        <a class="sidebar-link" href="itens.html">
            <span class="sidebar-link-icone">🎒</span>
            Inventário
        </a>
    </nav>

    <!-- Rodapé com botão de logout -->
    <div class="sidebar-footer">
        <button class="sidebar-btn-logout" onclick="fecharSidebar(); abrirModalLogout();">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair da conta
        </button>
    </div>
</aside>

<!-- ════════════════════════════════════════════════════════
     TOPO — BARRA PRINCIPAL
════════════════════════════════════════════════════════ -->
<header class="painel-topo">

    <!-- Hambúrguer -->
    <button class="btn-menu-hamburguer" id="btnHamburguer" onclick="abrirSidebar()" title="Menu" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Título -->
    <span class="painel-topo-titulo">⚔️ Fichas RPG</span>

    <div class="painel-topo-spacer"></div>

    <!-- Ações à direita -->
    <div class="painel-acoes">
        <button class="btn-acao" onclick="abrirModalCriar()">
            ＋ <span class="btn-acao-label">Criar Ficha</span>
        </button>
        <button class="btn-acao secundario" onclick="importarFicha()">
            ⬆ <span class="btn-acao-label">Importar</span>
        </button>

        <!-- Botão de usuário (visível em desktop, clica para abrir sidebar) -->
        <button class="btn-usuario-topo" id="btnUsuarioTopo" onclick="abrirSidebar()" title="Menu do usuário">
            <div class="avatar-mini">👤</div>
            <span id="topo-user-nome">...</span>
        </button>
    </div>
</header>

<!-- ════════════════════════════════════════════════════════
     BUSCA E FILTROS (linha separada)
══════════════════════════���═════════════════════════════ -->
<div class="painel-filtros-busca">
    <input type="text" id="inputBusca" placeholder="🔍  Pesquisar ficha..." oninput="filtrar()">
    <div class="filtros">
        <button class="btn-filtro active" onclick="filtrarCategoria('todos')">Todos</button>
        <button class="btn-filtro" onclick="filtrarCategoria('Guerreiro')">Guerreiros</button>
        <button class="btn-filtro" onclick="filtrarCategoria('Mago')">Magos</button>
        <button class="btn-filtro" onclick="filtrarCategoria('Assassino')">Assassinos</button>
        <button class="btn-filtro" onclick="filtrarCategoria('Suporte')">Suportes</button>
    </div>
</div>

<!-- ════════════════════════════════════════════════════════
     GRID DE PERSONAGENS
════════════════════════════════════════════════════════ -->
<main class="grid-personagens" id="gridPersonagens">
    <div class="estado-vazio">
        <div class="icone-vazio">⏳</div>
        <p>Carregando fichas...</p>
    </div>
</main>

<!-- ════════════════════════════════════════════════════════
     MODAL — CRIAR NOVA FICHA
════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modalCriar" onclick="fecharModalSeFora(event)">
    <div class="modal-box">
        <h2>Nova Ficha</h2>

        <label>Nome do Personagem</label>
        <input type="text" id="novo-nome" placeholder="Ex: Arthur, o Rei">

        <label>Gênero</label>
        <div id="modal-genero-selector" style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="genero-btn-modal" data-genero="Masculino" onclick="selecionarGeneroModal(this)">♂ Masculino</button>
            <button type="button" class="genero-btn-modal" data-genero="Feminino"  onclick="selecionarGeneroModal(this)">♀ Feminino</button>
            <button type="button" class="genero-btn-modal" data-genero="Outro"     onclick="selecionarGeneroModal(this)">⚧ Outro</button>
        </div>

        <label>Classe</label>
        <select id="nova-classe" onchange="toggleOutroClasse()">
            <option value="Guerreiro">⚔️ Guerreiro</option>
            <option value="Mago">🔮 Mago</option>
            <option value="Assassino">🗡️ Assassino</option>
            <option value="Suporte">🛡️ Suporte</option>
            <option value="__outro__">✏️ Outro...</option>
        </select>

        <!-- Campo que aparece ao escolher "Outro" -->
        <div id="outro-classe-wrap">
            <label>Digite o nome da classe</label>
            <input type="text" id="outro-classe-input" placeholder="Ex: Paladino, Druida, Necromante...">
        </div>

        <label>Imagem (URL ou deixe em branco)</label>
        <input type="text" id="nova-img" placeholder="https://...">

        <label>Ou carregue uma imagem local:</label>
        <input type="file" id="nova-img-file" accept="image/*" onchange="preCarregarImagem(event)" class="file-input">

        <div class="modal-botoes">
            <button class="btn-acao" onclick="criarFicha()">Criar</button>
            <button class="btn-acao secundario" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Menu de contexto -->
<div class="ctx-menu" id="ctxMenu">
    <button onclick="abrirFichaAtual()">📂 Abrir Ficha</button>
    <button onclick="editarFichaAtual()">✏️ Renomear</button>
    <button class="danger" onclick="excluirFichaAtual()">🗑 Excluir</button>
</div>

<!-- ════════════════════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
    // ── Sidebar ───────────────────────────────────────────────
    function abrirSidebar() {
        document.getElementById('sidebar').classList.add('aberta');
        document.getElementById('sidebarOverlay').classList.add('visivel');
        document.body.style.overflow = 'hidden';
    }
    function fecharSidebar() {
        document.getElementById('sidebar').classList.remove('aberta');
        document.getElementById('sidebarOverlay').classList.remove('visivel');
        document.body.style.overflow = '';
    }
    // Fecha com ESC
    document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharSidebar(); });

    // ── Preenche nome do usuário na sidebar e no topo ─────────
    function preencherUsuarioUI() {
        const sessao = typeof getSessao === 'function' ? getSessao() : null;
        if (!sessao) return;
        const primeiroNome = sessao.nome ? sessao.nome.split(' ')[0] : sessao.email;
        const elSidebar = document.getElementById('sidebar-user-nome');
        const elTopo    = document.getElementById('topo-user-nome');
        if (elSidebar) elSidebar.textContent = sessao.nome || sessao.email;
        if (elTopo)    elTopo.textContent    = primeiroNome;
    }

    // ── Garante que o widget fixo do auth.js NÃO seja injetado ─
    // (Substituímos pela sidebar — sobrescreve a função do auth.js)
    window.injetarUsuarioNav = function() {
        preencherUsuarioUI();
        // Não injeta o widget flutuante nesta página
    };

    // ── Inicialização ─────────────────────────────────────────
    exigirLogin().then(() => {
        preencherUsuarioUI();
    });
</script>

<script src="painel_de_escolhas_de_fichas.js"></script>

<script>
    // ── Gênero no modal ───────────────────────────────────────
    function selecionarGeneroModal(btn) {
        document.querySelectorAll('#modal-genero-selector .genero-btn-modal').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
    }

    // ── Campo "Outro" na classe ───────────────────────────────
    function toggleOutroClasse() {
        const sel   = document.getElementById('nova-classe');
        const wrap  = document.getElementById('outro-classe-wrap');
        const input = document.getElementById('outro-classe-input');
        const isOutro = sel.value === '__outro__';
        wrap.classList.toggle('visivel', isOutro);
        if (isOutro) setTimeout(() => input.focus(), 50);
        else input.value = '';
    }

    // ── Intercepta criarFicha para tratar "Outro" ─────────────
    const _criarFichaOriginal = criarFicha;
    criarFicha = async function () {
        const sel   = document.getElementById('nova-classe');
        const outro = document.getElementById('outro-classe-input');
        if (sel.value === '__outro__') {
            const nomeClasse = outro.value.trim();
            if (!nomeClasse) {
                outro.focus();
                outro.style.borderColor = '#e74c3c';
                setTimeout(() => outro.style.borderColor = '#c8aa6e', 1500);
                return;
            }
            sel.value = nomeClasse;
            if (!sel.querySelector(`option[value="${nomeClasse}"]`)) {
                const opt = document.createElement('option');
                opt.value = nomeClasse;
                opt.textContent = nomeClasse;
                opt.selected = true;
                sel.appendChild(opt);
            }
        }
        await _criarFichaOriginal();
    };
</script>

</body>
</html>
