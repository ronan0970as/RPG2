<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ficha RPG - Status</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ══ TEMA: Torre Gótica na Floresta Sombria (Foto 2) ══
           Paleta: azuis-escuros, cinzas, roxo nos detalhes
        ══════════════════════════════════════════════════════ */
        :root {
            --theme-accent:  #7c3aed;
            --theme-accent2: #a78bfa;
            --theme-glow:    rgba(124,58,237,0.45);
            --theme-panel:   rgba(10,8,18,0.82);
            --theme-border:  rgba(100,70,180,0.50);
        }

        body {
            background-image:
                linear-gradient(to bottom,
                    rgba(5,4,14,0.15) 0%,
                    rgba(6,5,16,0.08) 40%,
                    rgba(5,4,14,0.20) 100%
                ),
                url('torre_status.png');
            background-size: 75%;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* Decorações temáticas: substituir dragão/castelo por névoa roxa */
        body::before {
            content: '🌑';
            filter: drop-shadow(0 0 30px rgba(124,58,237,0.8));
            opacity: 0.22;
        }
        body::after {
            content: '🌲';
            filter: drop-shadow(0 0 20px rgba(100,70,180,0.6));
            opacity: 0.20;
        }

        /* Painel com toque roxo-escuro */
        .rpg-window {
            background: var(--theme-panel);
            border-top-color: var(--theme-accent);
            border-color: var(--theme-border);
        }
        .rpg-window::before, .rpg-window::after { content: '🔮'; filter: drop-shadow(0 0 6px var(--theme-glow)); }

        nav a:hover, nav a.active {
            background: rgba(124,58,237,0.20);
            border-color: var(--theme-accent2);
            color: var(--theme-accent2);
            text-shadow: 0 0 14px var(--theme-glow);
        }
        nav::after { background: linear-gradient(90deg, transparent, var(--theme-accent), transparent); }
        nav::before { content: '🗡️'; filter: drop-shadow(0 0 6px var(--theme-glow)); }

        h2 { color: var(--theme-accent2); text-shadow: 0 0 10px var(--theme-glow); }
        h2::before { background: linear-gradient(90deg, var(--theme-accent), transparent); }

        .status-bar { border-left-color: var(--theme-accent); background: rgba(124,58,237,0.06); }
        .attr-row { border-left-color: #5b21b6; }
        .attr-row:hover { border-left-color: var(--theme-accent2); background: rgba(124,58,237,0.10); }
        .char-foto-card { border-top-color: var(--theme-accent); border-color: var(--theme-border); }
        .char-foto-card::before { content: '🏰'; }
        .char-foto-wrap { border-color: #5b21b6; }

        /* Info básica */
        .section > div {
            display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
        }
        .section > div label { flex-shrink: 0; }
        .section > div input { flex: 1; min-width: 100px; }

        /* Barra de status */
        .status-bar {
            display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
            margin-bottom: 12px; background: rgba(124,58,237,0.07);
            border: 1px solid rgba(100,70,180,0.25); border-left: 3px solid var(--theme-accent);
            border-radius: 0 6px 6px 0; padding: 8px 10px;
        }
        .status-bar label { min-width: 80px; width: auto; }
        .status-bar .highlight { flex-shrink: 0; white-space: nowrap; }
        .status-bar .mod-input { flex: 1; min-width: 50px; }
        .status-bar .calc-btn  { flex-shrink: 0; }

        /* Gênero */
        .genero-selector { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
        .genero-btn {
            background: rgba(10,8,18,0.80); border: 1px solid #2d2060; color: #5b4fa0;
            padding: 8px 14px; border-radius: 5px; cursor: pointer;
            font-size: 13px; font-weight: bold; font-family: inherit;
            transition: 0.2s; min-height: 40px; white-space: nowrap;
        }
        .genero-btn:hover { border-color: var(--theme-accent2); color: var(--theme-accent2); background: rgba(124,58,237,0.10); }
        .genero-btn.ativo {
            background: rgba(124,58,237,0.18); border-color: var(--theme-accent2);
            color: var(--theme-accent2); box-shadow: 0 0 0 1px rgba(124,58,237,0.3);
        }

        /* Atributos */
        .attr-row {
            display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
            padding: 6px 8px; background: rgba(124,58,237,0.06);
            border-radius: 0 5px 5px 0; border-left: 2px solid #5b21b6; flex-wrap: wrap;
        }
        .attr-row label { min-width: 90px; width: auto; flex-shrink: 0; }
        .attr-row > span { color: #5b4fa0; flex-shrink: 0; }
        .attr-row input[type="number"] { width: 56px; flex-shrink: 0; }
        .attr-row .mod-input { flex: 1; min-width: 50px; }
        .attr-row .total-stat { flex-shrink: 0; font-size: 14px; color: var(--theme-accent2); text-shadow: 0 0 10px var(--theme-glow); }
    </style>
</head>
<body>

<nav>
    <a href="painel_de_escolhas_de_fichas.html">◀ Fichas</a>
    <a href="index.html" class="active">Status</a>
    <a href="talentos.html">Talentos</a>
    <a href="itens.html">Inventário</a>
</nav>

<div class="rpg-window">
    <div class="grid-container">

        <div class="char-card-col">
            <div class="char-foto-card">
                <div class="char-foto-wrap" id="char-foto-wrap">
                    <div class="char-foto-placeholder" id="char-foto-placeholder">⚔️</div>
                    <img id="char-foto-img" src="" alt="" style="display:none;">
                </div>
                <div class="char-foto-nome" id="char-foto-nome">—</div>
                <div class="char-foto-classe" id="char-foto-classe">—</div>
                <label class="char-foto-btn" title="Trocar foto">
                    📷 Trocar Foto
                    <input type="file" id="char-foto-file" accept="image/*" style="display:none;" onchange="trocarFotoPersonagem(event)">
                </label>
            </div>
        </div>

        <div>
            <h2>Info Básica</h2>
            <div class="section">
                <div><label>Jogador:</label> <input type="text" id="jogador" autocomplete="off"></div>
                <div><label>Personagem:</label> <input type="text" id="personagem" autocomplete="off" oninput="atualizarNomeCard()"></div>
                <div><label>Idade:</label> <input type="number" id="idade" inputmode="numeric"></div>
                <div><label>Nível (Lv):</label> <input type="number" id="nivel" value="0" inputmode="numeric" oninput="calcularStatus()"></div>
                <div><label>Raça:</label> <input type="text" id="raca" autocomplete="off"></div>
                <div style="align-items:flex-start;">
                    <label style="padding-top:4px;">Gênero:</label>
                    <div class="genero-selector">
                        <button type="button" class="genero-btn" data-genero="Masculino" onclick="selecionarGenero(this)">♂ Masculino</button>
                        <button type="button" class="genero-btn" data-genero="Feminino"  onclick="selecionarGenero(this)">♀ Feminino</button>
                        <button type="button" class="genero-btn" data-genero="Outro"     onclick="selecionarGenero(this)">⚧ Outro</button>
                    </div>
                </div>
                <div><label>Classe:</label> <input type="text" id="classe" placeholder="Ex: Guerreiro, Mago..." autocomplete="off" oninput="atualizarNomeCard()"></div>
            </div>

            <h2>Status Atuais</h2>
            <div class="section">
                <div class="status-bar">
                    <label>❤️ Vida (HP):</label>
                    <input type="number" id="vida-atual" value="0" style="font-weight:bold;color:#ff8c00;" inputmode="numeric" oninput="calcularStatusDebounced()">
                    <span class="highlight"> / <span id="vida-maxima">100</span></span>
                    <input type="text" id="vida-mod" class="mod-input" placeholder="+20, -10%">
                    <button class="calc-btn" onclick="modificarStatus('vida')">✓</button>
                </div>
                <div class="status-bar">
                    <label>💧 Mana (MP):</label>
                    <input type="number" id="mana-atual" value="0" style="font-weight:bold;color:#00bfff;" inputmode="numeric" oninput="calcularStatusDebounced()">
                    <span class="highlight"> / <span id="mana-maxima">10</span></span>
                    <input type="text" id="mana-mod" class="mod-input" placeholder="+/-/%">
                    <button class="calc-btn" onclick="modificarStatus('mana')">✓</button>
                </div>
                <div class="status-bar">
                    <label>🧠 Sanidade:</label>
                    <input type="number" id="sanidade-atual" value="0" style="font-weight:bold;color:#b0c4de;" inputmode="numeric" oninput="calcularStatusDebounced()">
                    <span class="highlight"> / 100</span>
                    <input type="text" id="sanidade-mod" class="mod-input" placeholder="+/-/%">
                    <button class="calc-btn" onclick="modificarStatus('sanidade')">✓</button>
                </div>
            </div>
        </div>

        <div>
            <h2>Atributos (Base + Bônus = Total)</h2>
            <div class="section">
                <div class="attr-row">
                    <label>⚔️ Força:</label>
                    <input type="number" id="forca-base" value="0" inputmode="numeric" oninput="calcularStatus()">
                    <span>+</span>
                    <input type="text" id="forca-bonus" class="mod-input" value="0" placeholder="+/-/%" oninput="calcularStatus()">
                    <span class="total-stat" id="forca-total">= 0</span>
                </div>
                <div class="attr-row">
                    <label>💨 Velocidade:</label>
                    <input type="number" id="vel-base" value="0" inputmode="numeric" oninput="calcularStatus()">
                    <span>+</span>
                    <input type="text" id="vel-bonus" class="mod-input" value="0" placeholder="+/-/%" oninput="calcularStatus()">
                    <span class="total-stat" id="vel-total">= 0</span>
                </div>
                <div class="attr-row">
                    <label>🧠 Inteligência:</label>
                    <input type="number" id="int-base" value="0" inputmode="numeric" oninput="calcularStatus()">
                    <span>+</span>
                    <input type="text" id="int-bonus" class="mod-input" value="0" placeholder="+/-/%" oninput="calcularStatus()">
                    <span class="total-stat" id="int-total">= 0</span>
                </div>
                <div class="attr-row">
                    <label>🛡️ Defesa:</label>
                    <input type="number" id="defesa-base" value="0" inputmode="numeric" oninput="calcularStatus()">
                    <span>+</span>
                    <input type="text" id="defesa-bonus" class="mod-input" value="0" placeholder="+/-/%" oninput="calcularStatus()">
                    <span class="total-stat" id="defesa-total">= 0</span>
                </div>
                <div class="attr-row">
                    <label>🏹 Pontaria:</label>
                    <input type="number" id="pont-base" value="0" inputmode="numeric" oninput="calcularStatus()">
                    <span>+</span>
                    <input type="text" id="pont-bonus" class="mod-input" value="0" placeholder="+/-/%" oninput="calcularStatus()">
                    <span class="total-stat" id="pont-total">= 0</span>
                </div>
                <div class="attr-row">
                    <label>🗣️ Carisma:</label>
                    <input type="number" id="car-base" value="0" inputmode="numeric" oninput="calcularStatus()">
                    <span>+</span>
                    <input type="text" id="car-bonus" class="mod-input" value="0" placeholder="+/-/%" oninput="calcularStatus()">
                    <span class="total-stat" id="car-total">= 0</span>
                </div>
                <div class="attr-row">
                    <label>🌑 Furtividade:</label>
                    <input type="number" id="furt-base" value="0" inputmode="numeric" oninput="calcularStatus()">
                    <span>+</span>
                    <input type="text" id="furt-bonus" class="mod-input" value="0" placeholder="+/-/%" oninput="calcularStatus()">
                    <span class="total-stat" id="furt-total">= 0</span>
                </div>
            </div>

            <h2>Efeitos de Habilidades Ativos</h2>
            <div class="section">
                <textarea id="habilidades-ativas"
                    placeholder="Ex: Força Extra (+1 Força a cada 50 Mana)."
                    style="height:60px;"></textarea>
            </div>

            <button class="save-btn" onclick="salvarFicha()">💾 Salvar Ficha</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>exigirLogin().then(() => { document.addEventListener('DOMContentLoaded', injetarUsuarioNav); });</script>
<script src="buffs.js"></script>
<script src="java.js"></script>
<script>
    let _fichaAlterada = false;
    function marcarAlterada() { _fichaAlterada = true; }

    window.addEventListener('beforeunload', e => {
        if (_fichaAlterada) { e.preventDefault(); e.returnValue = ''; }
    });

    const _salvarFichaOriginal = salvarFicha;
    salvarFicha = async function() {
        await _salvarFichaOriginal();
        _fichaAlterada = false;
    };

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('input, textarea, select').forEach(el => {
            el.addEventListener('input', marcarAlterada);
            el.addEventListener('change', marcarAlterada);
        });
    });

    function selecionarGenero(btn) {
        document.querySelectorAll('.genero-btn').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        marcarAlterada();
    }
</script>
</body>
</html>
